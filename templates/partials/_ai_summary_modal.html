{#
  AI communications summary modal — opened by the [AI Summary] button on the
  RFQ communications tab.

  Requires the Alpine component `aiSummaryModal()` to be registered (in base.html).
  Usage:
    <div x-data="aiSummaryModal">
      {% include "partials/_ai_summary_modal.html" %}
    </div>
#}
<div x-show="show" x-cloak
     class="fixed inset-0 z-[9998] flex items-center justify-center p-4"
     @keydown.escape.window="close()">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" @click="close()" x-transition.opacity></div>
    <!-- Modal panel -->
    <div class="relative w-full bg-white dark:bg-gray-900 rounded-lg shadow-xl flex flex-col overflow-hidden"
         style="max-width: 720px; max-height: 85vh"
         x-transition @click.stop>
        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
                <svg class="w-4 h-4 text-indigo-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate">Agent Summary — Communications Overview</h3>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button @click="refresh()"
                        :disabled="loading"
                        class="inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-medium border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh
                </button>
                <button @click="close()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Body -->
        <div class="flex-1 overflow-y-auto px-5 py-4 min-h-0">
            <div x-show="loading" class="flex items-center gap-2 text-sm text-gray-400">
                <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span x-text="refreshing ? 'Regenerating summary…' : 'Generating summary… this can take a few seconds'"></span>
            </div>
            <div x-show="error" x-cloak class="flex items-center gap-2 text-sm text-gray-500 bg-gray-100 dark:bg-gray-800 rounded p-3">
                <svg class="w-5 h-5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span x-text="error"></span>
            </div>
            <div x-show="markdownHtml" x-cloak>
                <div id="ai-summary-body" class="email-body ai-summary text-sm leading-relaxed" x-html="markdownHtml"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between px-5 py-2.5 border-t border-gray-200 dark:border-gray-700 shrink-0 bg-gray-50 dark:bg-gray-800">
            <span x-show="meta" x-cloak class="text-xs text-gray-400">
                <span x-text="meta.from_cache ? 'Cached' : 'Generated'"></span>
                <template x-if="meta.generated_at">
                    <span> · <span x-text="new Date(meta.generated_at).toLocaleString()"></span></span>
                </template>
            </span>
            <span></span>
        </div>
    </div>
</div>
