<div class="pt-6 max-w-6xl mx-auto px-4">
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 mb-4">
        <a hx-get="/partial/admin" hx-target="#main-content" hx-push-url="/admin"
           class="hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer">Admin</a>
        <span>›</span>
        <span class="text-gray-900 dark:text-gray-100">Supplier Duplicates</span>
    </nav>

    <div class="flex items-center justify-between mb-6">
        <div class="min-w-0 mr-4">
            <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100">Supplier Deduplication</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 max-w-sm">Find and merge duplicate suppliers. Run internal scan first, then NetSuite scan.</p>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
            <input type="text" name="name_filter" placeholder="Filter by name..."
                   class="px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-48">
            <form hx-post="/admin/duplicates/scan" hx-target="#dedup-results" hx-swap="innerHTML" hx-indicator="#scan-spinner" hx-include="[name='name_filter']">
                <input type="hidden" name="scan_mode" value="internal">
                <button type="submit" class="px-4 py-2 text-sm font-medium rounded-lg bg-amber-600 text-white hover:bg-amber-700 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    Web-add Duplicates
                </button>
            </form>
            <form hx-post="/admin/duplicates/scan" hx-target="#dedup-results" hx-swap="innerHTML" hx-indicator="#scan-spinner" hx-include="[name='name_filter']">
                <input type="hidden" name="scan_mode" value="netsuite">
                <button type="submit" class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    NetSuite Duplicates
                </button>
            </form>
            <svg id="scan-spinner" class="htmx-indicator w-5 h-5 animate-spin text-gray-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        </div>
    </div>

    <div id="dedup-results">
    {% include "partials/_admin_dedup_results.html" %}
    </div>
</div>
