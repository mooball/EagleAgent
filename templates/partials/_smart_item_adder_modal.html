{# Smart Item Adder Modal — paste/drop HTML tables, images, or text for RFQ item import #}
<template x-if="smartAddOpen">
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
     @click.self="smartAddOpen = false">
  <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-h-[90vh] flex flex-col m-4"
       style="max-width: 56rem; width: 100%;">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Smart Add Items</h2>
      <button @click="smartAddOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-xl">&times;</button>
    </div>

    <!-- Step 1: Input Area -->
    <div class="p-4 border-b border-gray-200 dark:border-gray-700" x-show="!previewItems.length">
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-3">
        Paste or drop a table, CSV, or screenshot below. Content will appear here so you can verify it before extracting.
      </p>
      <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-4 text-center
                  transition-colors"
           :class="dragOver ? 'border-indigo-400 bg-indigo-50 dark:bg-indigo-900/20' : ''"
           @dragover.prevent="dragOver = true"
           @dragleave="dragOver = false"
           @drop.prevent="handleDrop($event)">

        <!-- Paste target: renders pasted HTML tables, images, and plain text inline.
             No preventDefault on HTML/text paste — the browser renders the content.
             Images are inserted as <img> elements.
             Uses CSS :empty:before for placeholder when nothing has been pasted. -->
        <div contenteditable="true"
             @paste="handlePaste($event)"
             @input="handleInput($event)"
             class="paste-area min-h-[100px] max-h-[280px] overflow-y-auto text-left
                    border border-gray-200 dark:border-gray-600 rounded p-3
                    focus:outline-none focus:border-indigo-400 dark:focus:border-indigo-500
                    bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-sm"
             x-ref="pasteArea"></div>

        <!-- Status indicator — shows what was captured -->
        <div class="mt-2 flex items-center justify-center gap-2">
          <span x-show="pasteHtml && !imageBase64"
                class="text-xs px-2 py-0.5 rounded-full bg-green-100 dark:bg-green-900/30
                       text-green-700 dark:text-green-400">
            📋 HTML table ready
          </span>
          <span x-show="imageBase64"
                class="text-xs px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/30
                       text-blue-700 dark:text-blue-400">
            📷 Screenshot ready
          </span>
          <span x-show="pasteText && !pasteHtml && !imageBase64"
                class="text-xs px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/30
                       text-amber-700 dark:text-amber-400">
            📝 Text ready
          </span>
        </div>
      </div>

      <!-- Extraction error — shown inline when no items were found -->
      <div x-show="extractionError" x-cloak
           class="mt-3 p-3 rounded-lg border border-red-200 dark:border-red-700
                  bg-red-50 dark:bg-red-900/20 text-sm text-red-700 dark:text-red-400"
           x-html="extractionError"></div>

      <div class="flex justify-end mt-4 gap-3">
        <button @click="smartAddOpen = false"
                class="btn">
          Cancel
        </button>
        <button @click="extractItems()"
                :disabled="extracting"
                class="btn bg-indigo-600 text-white hover:bg-indigo-500 hover:text-white border-indigo-600">
          <span x-show="!extracting">🔍 Extract Items</span>
          <span x-show="extracting" class="flex items-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Extracting...
          </span>
        </button>
      </div>
    </div>

    <!-- Step 2: Preview Table -->
    <div class="flex-1 overflow-auto p-4" x-show="previewItems.length" x-cloak>
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm text-gray-600 dark:text-gray-400"
              x-text="previewItems.length + ' item' + (previewItems.length !== 1 ? 's' : '') + ' extracted'"></span>
        <button @click="resetExtraction()"
                class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">
          ← Try again
        </button>
      </div>

      <!-- Warnings -->
      <div x-show="warnings.length" class="mb-3">
        <template x-for="w in warnings">
          <div class="text-xs text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20
                      border border-amber-200 dark:border-amber-700
                      rounded px-2 py-1 mb-1" x-text="w"></div>
        </template>
      </div>

      <!-- Editable table.
           Uses `fields` array (parallel to `headers`) for x-model binding,
           avoiding error-prone key lookups through columnMapping in the template. -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="bg-gray-50 dark:bg-gray-700">
              <th class="border border-gray-200 dark:border-gray-600 px-2 py-1 text-left text-xs text-gray-500 dark:text-gray-400 w-8">#</th>
              <template x-for="h in headers">
                <th class="border border-gray-200 dark:border-gray-600 px-2 py-1 text-left text-xs text-gray-500 dark:text-gray-400"
                    :style="thWidth(h)"
                    x-text="h"></th>
              </template>
              <th class="border border-gray-200 dark:border-gray-600 px-2 py-1 text-left text-xs text-gray-500 dark:text-gray-400 w-8"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(item, idx) in previewItems">
              <tr>
                <td class="border border-gray-200 dark:border-gray-600 px-2 py-1 text-gray-400 dark:text-gray-500 text-xs"
                    x-text="idx + 1"></td>
                <template x-for="(field, colIdx) in fields">
                  <td class="border border-gray-200 dark:border-gray-600 p-0"
                      :style="fieldWidth(field)">
                    <input type="text"
                           class="w-full px-2 py-1 border-0 focus:ring-1 focus:ring-indigo-300 dark:focus:ring-indigo-500
                                  focus:outline-none text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
                           :class="{ 'text-center': field === 'quantity' || field === 'uom' }"
                           x-model="item[field]">
                  </td>
                </template>
                <!-- Delete row button -->
                <td class="border border-gray-200 dark:border-gray-600 px-1 py-1 text-center">
                  <button @click="previewItems.splice(idx, 1)"
                          class="text-red-400 hover:text-red-600 dark:hover:text-red-300 text-sm leading-none"
                          title="Remove row">&times;</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-between items-center p-4 border-t border-gray-200 dark:border-gray-700"
         x-show="previewItems.length" x-cloak>
      <button @click="resetExtraction()"
              class="btn">
        Cancel
      </button>
      <button @click="confirmAdd()"
              :disabled="adding"
              class="btn bg-green-600 text-white hover:bg-green-500 hover:text-white border-green-600">
        <span x-show="!adding">Confirm &amp; Add Items</span>
        <span x-show="adding" class="flex items-center gap-2">
          <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Adding...
        </span>
      </button>
    </div>

  </div>
</div>
</template>

{# CSS for contenteditable placeholder — since contenteditable doesn't support
   the placeholder HTML attribute natively, we use a :empty:before pseudo-element. #}
<style>
  .paste-area:empty:before {
    content: 'Paste table here (Ctrl+V / Cmd+V)...';
    color: #9ca3af;
    pointer-events: none;
  }
</style>
