<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EagleAgent{% endblock %}</title>
    <!-- Tailwind CSS: use pre-built file in prod, fall back to CDN for local dev -->
    <link rel="stylesheet" href="/public/tailwind.min.css?v={{ css_version | default('dev') }}"
          onerror="if(!window.__twFallback){window.__twFallback=1;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4';document.head.appendChild(s);var st=document.createElement('style');st.type='text/tailwindcss';st.textContent='@custom-variant dark (&:where(.dark, .dark *));';document.head.appendChild(st)}">
    <script>
        // Restore theme before paint to prevent flash
        if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Marked.js (lightweight markdown renderer) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Preline UI JS (vendored, auto-init — powers data-hs-* components) -->
    <script defer src="/public/vendor/preline/dist/preline.js?v={{ css_version | default('dev') }}"></script>
    <!-- Jodit (free rich text editor for in-app email compose) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jodit@4.2.27/es2021/jodit.fat.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jodit@4.2.27/es2021/jodit.fat.min.js"></script>
    <script>htmx.config.allowScriptTags = true;
    // Disable htmx's localStorage history cache: back/forward must always
    // refetch from the server so email/pipeline updates are never stale.
    htmx.config.historyCacheSize = 0;</script>
    <style>
        [x-cloak] { display: none !important; }
        .border-l-3 { border-left-width: 3px; }
        :root {
            --cell-dirty-bg: #fefce8; /* amber-50 */
            --cell-focus-bg: #eff6ff; /* blue-50 */
        }
        html.dark {
            --cell-dirty-bg: #78350f; /* amber-900 */
            --cell-focus-bg: #1e3a8a; /* blue-900 */
        }
        .email-body { font-size: 12px; line-height: 1.5; color: #4b5563; }
        .email-body p { margin: 0.25em 0; }
        .email-body table { border-collapse: collapse; margin: 0.5em 0; font-size: 11px; }
        .email-body th, .email-body td { border: 1px solid #e5e7eb; padding: 2px 6px; }
        .email-body th { background: #f9fafb; font-weight: 600; }
        .email-body hr { border-color: #d1d5db; margin: 0.75em 0; opacity: 0.5; }
        .email-body strong { font-weight: 600; color: #374151; }
        .email-body a { color: #2563eb; text-decoration: underline; }
        .email-body img { max-width: 100%; height: auto; background: #e5e7eb; min-width: 32px; min-height: 32px; border-radius: 2px; }
        .email-body ul, .email-body ol { padding-left: 1.2em; margin: 0.25em 0; }
        .email-body ul { list-style: disc; }
        .email-body ol { list-style: decimal; }
        .email-body li { margin: 0.15em 0; }
        .ai-summary h1, .ai-summary h2, .ai-summary h3, .ai-summary h4 {
            font-weight: 700; margin: 1em 0 0.35em; color: #1f2937;
        }
        .ai-summary h1, .ai-summary h2 { font-size: 15px; }
        .ai-summary h3, .ai-summary h4 { font-size: 13px; }
        .dark .ai-summary h1, .dark .ai-summary h2, .dark .ai-summary h3, .dark .ai-summary h4 { color: #f3f4f6; }
        .ts-ago { color: #9ca3af; }
        .dark .email-body { color: #9ca3af; }
        .dark .email-body strong { color: #e5e7eb; }
        .dark .email-body th { background: #374151; }
        .dark .email-body th, .dark .email-body td { border-color: #4b5563; }
        .dark .email-body hr { border-color: #4b5563; }
        .dark .email-body a { color: #60a5fa; }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100"
      x-data="dashboard()" x-init="init()">

    <!-- Header -->
    <header class="h-14 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 shadow-xs relative z-50">
        <div class="flex items-center gap-2">
            <a href="/" class="flex items-center gap-2 text-lg font-bold text-gray-800 dark:text-gray-100 hover:text-blue-600 dark:hover:text-blue-400">
                <img src="/public/eagle-icon.png" alt="" class="w-7 h-7">
                EagleAgent
            </a>
        </div>

        <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
            <a href="/rfqs"
               hx-get="/partial/rfqs" hx-target="#main-content" hx-push-url="/rfqs"
               class="nav-link px-3 py-1.5 rounded-md transition-colors
                      {% if active_nav == 'rfqs' %}bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300{% else %}text-gray-500 hover:text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-gray-200 dark:hover:bg-gray-700{% endif %}">
                RFQs
            </a>
        </nav>

        <div class="flex items-center gap-1">
            <!-- Agent working indicator (clickable to stop) -->
            <button x-show="agentWorking" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
                 x-data="{ hovered: false }"
                 @mouseenter="hovered = true" @mouseleave="hovered = false"
                 @click="stopAgent()"
                 :class="hovered ? 'bg-red-600' : 'bg-blue-600'"
                 class="flex items-center gap-1.5 px-2.5 py-1 text-white text-xs font-medium rounded-full mr-2 cursor-pointer transition-colors"
                 title="Click to stop agent">
                <svg x-show="!hovered" class="animate-spin h-3 w-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <svg x-show="hovered" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                <span x-show="!hovered" x-text="agentWorkingLabel"></span>
                <span x-show="hovered">Stop</span>
            </button>

            <!-- Agent panel controls -->
            <div class="flex items-center gap-0.5 mr-2">
                <!-- Toggle chat (open/close) -->
                <button @click="agentState = agentState === 'closed' ? 'panel' : 'closed'"
                        :class="agentState !== 'closed' ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'"
                        class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700" title="Toggle chat">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </button>
                <!-- Sidebar mode -->
                <button x-show="agentState !== 'closed'"
                        @click="agentState = 'panel'" title="Sidebar"
                        :class="agentState === 'panel' ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'"
                        class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/><line x1="15" y1="3" x2="15" y2="21" stroke-width="2"/></svg>
                </button>
                <!-- Expand mode -->
                <button x-show="agentState !== 'closed'"
                        @click="agentState = 'expanded'" title="Expand"
                        :class="agentState === 'expanded' ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'"
                        class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/></svg>
                </button>
            </div>

            <div class="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-1"></div>

            <!-- Dark mode toggle -->
            <button @click="toggleTheme()" class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400" title="Toggle dark mode">
                <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>

            <!-- User menu dropdown -->
            <div class="relative ml-2" x-data="{ userMenuOpen: false }">
                <button @click="userMenuOpen = !userMenuOpen" @click.outside="userMenuOpen = false"
                        class="flex items-center gap-2 p-1 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    {% if user.picture %}
                    <img src="/avatar" alt="" class="w-8 h-8 rounded-full">
                    {% else %}
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-medium">
                        {{ (user.given_name or user.email)[0] | upper }}
                    </div>
                    {% endif %}
                    <span class="text-sm text-gray-700 dark:text-gray-300 hidden sm:inline">{{ user.given_name or user.email }}</span>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <!-- Dropdown -->
                <div x-show="userMenuOpen"
                     x-transition:enter="transition ease-out duration-100"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-75"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95"
                     class="absolute right-0 mt-1 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg border border-gray-200 dark:border-gray-700 py-1 z-50">
                    <div class="px-3 py-2 border-b border-gray-100 dark:border-gray-700">
                        <p class="text-sm font-medium">{{ user.given_name or user.email }}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ user.email }}</p>
                    </div>
                    {% if user and user.role == 'Admin' %}
                    <a href="/users"
                       hx-get="/partial/users" hx-target="#main-content" hx-push-url="/users"
                       @click="userMenuOpen = false"
                       class="block px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        Users
                    </a>
                    <a href="/admin"
                       hx-get="/partial/admin" hx-target="#main-content" hx-push-url="/admin"
                       @click="userMenuOpen = false"
                       class="block px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        System Admin
                    </a>
                    <a href="/admin/mailboxes"
                       hx-get="/admin/mailboxes" hx-target="#main-content" hx-push-url="/admin/mailboxes"
                       @click="userMenuOpen = false"
                       class="block px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        Mailbox Scanning
                    </a>
                    <a href="/emails"
                       hx-get="/emails" hx-target="#main-content" hx-push-url="/emails"
                       @click="userMenuOpen = false"
                       class="block px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        Email Logs
                    </a>
                    {% endif %}
                    {% if user and user.role != 'Admin' %}
                    <a href="/emails"
                       hx-get="/emails" hx-target="#main-content" hx-push-url="/emails"
                       @click="userMenuOpen = false"
                       class="block px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        Email Logs
                    </a>
                    {% endif %}
                    <a href="/logout"
                       class="block px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        Sign out
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Body: main content + agent panel -->
    <div class="h-[calc(100vh-3.5rem)] relative overflow-hidden">

        <!-- Main content area -->
        <main id="main-content"
              class="h-full overflow-y-auto transition-panel px-6 pb-6"
              :class="{
                  'hidden': agentState === 'expanded'
              }"
              :style="agentState === 'panel' ? 'margin-right:' + panelWidth + 'px' : ''">
            {% block content %}{% endblock %}
        </main>

        <!-- Agent chat panel (right sidebar or full-width) -->
        <aside x-show="agentState !== 'closed'"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="translate-x-full"
               x-transition:enter-end="translate-x-0"
               x-transition:leave="transition ease-in duration-150"
               x-transition:leave-start="translate-x-0"
               x-transition:leave-end="translate-x-full"
               :class="{ 'inset-x-0': agentState === 'expanded' }"
               :style="agentState === 'panel' ? 'width:' + panelWidth + 'px' : ''"
               class="fixed top-14 right-0 bottom-0 z-40 bg-white dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 shadow-xl flex flex-col">

            <!-- Drag handle for resizing -->
            <div x-show="agentState === 'panel'"
                 @mousedown="startResize($event)"
                 class="drag-handle absolute left-0 top-0 bottom-0 w-1.5 z-50"
                 :class="{ 'dragging': isResizing }"></div>

            <!-- Overlay to prevent iframe from stealing mouse events during resize -->
            <div x-show="isResizing" class="absolute inset-0 z-40"></div>

            <!-- Chat iframe — never destroyed, only hidden -->
            <iframe id="agent-iframe" src="/chat" class="flex-1 w-full border-0"></iframe>
        </aside>
    </div>

    <script>
        function dashboard() {
            return {
                agentState: localStorage.getItem('agentState') || 'panel',
                panelWidth: parseInt(localStorage.getItem('panelWidth') || '420', 10),
                isResizing: false,
                currentContext: {},
                agentWorking: false,
                agentWorkingLabel: '',
                _chatProfile: 'Eagle Agent',  // assume Eagle Agent until told otherwise

                init() {
                    // Pre-set the iframe's theme in localStorage before it loads,
                    // so Chainlit renders with the correct theme immediately
                    const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                    try { localStorage.setItem('vite-ui-theme', currentTheme); } catch (_) {}

                    // Also send via postMessage once iframe finishes loading
                    const iframe = document.getElementById('agent-iframe');
                    if (iframe) {
                        iframe.addEventListener('load', () => {
                            this.syncThemeToIframe();
                            this.pushContext();
                            // Extract thread_id from iframe URL as fallback
                            try {
                                const iframePath = iframe.contentWindow.location.pathname;
                                const m = iframePath.match(/\/chat\/thread\/([a-f0-9-]+)/i);
                                if (m) this._activeThreadId = m[1];
                            } catch (_) {}
                        });
                    }

                    // Watch for agent state changes and persist
                    this.$watch('agentState', (val) => {
                        localStorage.setItem('agentState', val);
                    });

                    // Listen for agent-working events from rfqDetail actions
                    window.addEventListener('agent-working', (e) => {
                        this.agentWorking = true;
                        this.agentWorkingLabel = e.detail?.label || 'Agent working...';
                        // Safety timeout: auto-clear after 10 minutes in case agent_done is never received
                        clearTimeout(this._agentWorkingTimeout);
                        this._agentWorkingTimeout = setTimeout(() => { this.agentWorking = false; }, 600000);
                    });

                    // Safety net: ensure thread is bound before any agent action
                    window.addEventListener('ensure-rfq-bound', () => {
                        this._ensureRfqBound();
                    });

                    // Listen for navigation/refresh commands from the agent iframe
                    window.addEventListener('message', (event) => {
                        if (event.origin !== window.location.origin) return;
                        if (event.data?.type === 'agent_navigate') {
                            const url = event.data.payload?.url;
                            if (url) {
                                htmx.ajax('GET', '/partial' + url, {
                                    target: '#main-content',
                                    swap: 'innerHTML'
                                });
                                history.pushState({}, '', url);
                                if (this.agentState === 'expanded') {
                                    this.agentState = 'panel';
                                }
                            }
                        }
                        if (event.data?.type === 'dashboard_refresh') {
                            // Re-fetch the current partial to refresh displayed data
                            const path = window.location.pathname;
                            htmx.ajax('GET', '/partial' + path, {
                                target: '#main-content',
                                swap: 'innerHTML'
                            });
                            // Don't clear agentWorking here — tools send refresh
                            // mid-process; only explicit agent_done should clear it.
                        }
                        if (event.data?.type === 'agent_working') {
                            this.agentWorking = true;
                            this.agentWorkingLabel = event.data.payload?.label || 'Agent working...';
                            // Reset safety timeout on each working signal
                            clearTimeout(this._agentWorkingTimeout);
                            this._agentWorkingTimeout = setTimeout(() => { this.agentWorking = false; }, 600000);
                        }
                        if (event.data?.type === 'agent_done') {
                            this.agentWorking = false;
                            clearTimeout(this._agentWorkingTimeout);
                        }
                        if (event.data?.type === 'chat_profile_change' && event.data.profile) {
                            this._chatProfile = event.data.profile;
                        }
                        if (event.data?.type === 'bind_rfq_thread' && event.data.rfqId) {
                            // User clicked "Link" in the iframe banner — rebind
                            // Only allow binding from Eagle Agent profile
                            if (this._chatProfile !== 'Eagle Agent') return;
                            const rfqId = event.data.rfqId;
                            const threadId = this._activeThreadId;
                            if (threadId) {
                                fetch('/api/rfq-thread', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    credentials: 'same-origin',
                                    body: JSON.stringify({rfq_id: rfqId, thread_id: threadId}),
                                }).then(resp => {
                                    if (resp.ok) {
                                        this.currentContext.thread_id = threadId;
                                        this._activeThreadRfqId = rfqId;
                                        this.pushContext();
                                    }
                                }).catch(() => {});
                            }
                        }
                        if (event.data?.type === 'thread_id' && event.data.threadId) {
                            // Track the active thread so we don't overwrite on reload
                            const newThreadId = event.data.threadId;
                            this._activeThreadId = newThreadId;
                            // Re-push context so the iframe banner updates
                            this.pushContext();

                            // Only bind/rebind if on Eagle Agent profile
                            if (this._chatProfile !== 'Eagle Agent') return;

                            // Only rebind if we explicitly tried to load the bound thread
                            // and Chainlit gave us a different one (thread was stale/deleted).
                            // Do NOT rebind when the user manually switches threads in the sidebar.
                            const ctx = this.currentContext;
                            if (this._expectingBoundThread && this._expectingBoundThread !== newThreadId) {
                                console.log('[bind] Stale thread detected, rebinding', ctx.id, 'to', newThreadId);
                                this._expectingBoundThread = null;
                                fetch('/api/rfq-thread', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    credentials: 'same-origin',
                                    body: JSON.stringify({rfq_id: ctx.id, thread_id: newThreadId}),
                                }).then(resp => {
                                    if (resp.ok) {
                                        this.currentContext.thread_id = newThreadId;
                                        this._activeThreadRfqId = ctx.id;
                                        this.pushContext();
                                    }
                                }).catch(() => {});
                            } else {
                                // Clear the expectation flag once matched
                                if (this._expectingBoundThread === newThreadId) {
                                    this._expectingBoundThread = null;
                                }
                            }

                            // Auto-bind to RFQ if viewing one without a bound thread
                            this._ensureRfqBound();
                            // Legacy: if _pendingRfqBind is set for a new-RFQ flow
                            if (this._pendingRfqBind) {
                                const rfqId = this._pendingRfqBind;
                                const isNewRfq = this._pendingNewRfq;
                                const threadId = event.data.threadId;
                                this._pendingRfqBind = null;
                                this._pendingNewRfq = false;
                                // Binding already handled by _ensureRfqBound above,
                                // but still handle new_rfq intent trigger
                                if (isNewRfq) {
                                    fetch('/api/agent-bridge', {
                                        method: 'POST',
                                        headers: {'Content-Type': 'application/json'},
                                        credentials: 'same-origin',
                                        body: JSON.stringify({action: {name: 'new_rfq', payload: {}}}),
                                    }).catch(() => {});
                                }
                            }
                        }
                        if (event.data?.type === 'session_id' && event.data.sessionId) {
                            // Track the iframe's Chainlit session_id for cookie reclaim
                            this._chainlitSessionId = event.data.sessionId;
                        }
                    });

                    // Reclaim the Chainlit session cookie when this tab gains focus.
                    // Prevents multi-tab cookie collision (last tab to connect owns
                    // the cookie; switching back would send the wrong session_id).
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible' && this._chainlitSessionId) {
                            fetch('/chat/set-session-cookie', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                credentials: 'same-origin',
                                body: JSON.stringify({session_id: this._chainlitSessionId}),
                            }).catch(() => {});
                            // Also re-push dashboard context so the agent knows
                            // which RFQ this tab is viewing (context is per-user,
                            // not per-tab, so switching tabs can leave stale context).
                            this.updateContext();
                            this.pushContext();
                        }
                    });

                    // Set initial context from the page (may switch iframe to an RFQ thread)
                    this.updateContext();

                    // Resume the user's most recent persisted thread — but only if
                    // updateContext() didn't already switch to an RFQ-bound thread
                    // or start an on-demand bind (_pendingRfqBind).
                    if (!this._activeThreadId && !this._pendingRfqBind) {
                        fetch('/api/latest-thread', { credentials: 'same-origin' })
                            .then(r => r.json())
                            .then(data => {
                                if (data.thread_id) {
                                    if (this._setIframeSrc('/chat/thread/' + data.thread_id)) {
                                        this._activeThreadId = data.thread_id;
                                    }
                                }
                            })
                            .catch(() => {});
                    }

                    // Infinite scroll: fire 'intersect' on sentinel when scrolled near bottom
                    // (backup for containers where IntersectionObserver root differs)
                    const mainEl = document.getElementById('main-content');
                    mainEl.addEventListener('scroll', () => {
                        if (mainEl.scrollTop + mainEl.clientHeight >= mainEl.scrollHeight - 200) {
                            const sentinel = mainEl.querySelector('[hx-trigger="intersect"]');
                            if (sentinel && !sentinel.classList.contains('htmx-request')) {
                                htmx.trigger(sentinel, 'intersect');
                            }
                        }
                    });

                    // Listen for HTMX page swaps to update context
                    document.body.addEventListener('htmx:afterSwap', (event) => {
                        this.updateContext();
                        this.updateActiveNav();
                        // Re-initialize Alpine components in swapped content
                        if (window.Alpine && event.detail && event.detail.target) {
                            Alpine.initTree(event.detail.target);
                        }
                    });
                },

                /* ---- Panel resize ---- */
                startResize(e) {
                    e.preventDefault();
                    this.isResizing = true;
                    const main = document.getElementById('main-content');
                    main.classList.add('no-transition');

                    const onMove = (ev) => {
                        const newWidth = Math.max(300, Math.min(window.innerWidth - 200, window.innerWidth - ev.clientX));
                        this.panelWidth = newWidth;
                    };
                    const onUp = () => {
                        this.isResizing = false;
                        main.classList.remove('no-transition');
                        localStorage.setItem('panelWidth', String(this.panelWidth));
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                toggleTheme() {
                    const html = document.documentElement;
                    var theme;
                    if (html.classList.contains('dark')) {
                        html.classList.remove('dark');
                        theme = 'light';
                    } else {
                        html.classList.add('dark');
                        theme = 'dark';
                    }
                    localStorage.theme = theme;
                    // Keep Chainlit's own key in sync (shared localStorage)
                    try { localStorage.setItem('vite-ui-theme', theme); } catch (_) {}
                    this.syncThemeToIframe();
                },

                syncThemeToIframe() {
                    const iframe = document.getElementById('agent-iframe');
                    const theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                    if (iframe?.contentWindow) {
                        iframe.contentWindow.postMessage({ type: 'theme-change', theme: theme }, '*');
                    }
                },

                stopAgent() {
                    fetch('/api/stop-agent', { method: 'POST', credentials: 'same-origin' })
                        .then(() => {
                            this.agentWorking = false;
                            clearTimeout(this._agentWorkingTimeout);
                        })
                        .catch(err => console.warn('[stopAgent] failed:', err));
                },

                // Single choke point for chat navigation. Reloading the iframe tears
                // down the Chainlit websocket, which invalidates the client-held session
                // id that /project/file needs — so callers must decide whether a reload
                // is warranted before calling. Do not dedupe on the src attribute here:
                // it only records what we last set and does not follow navigation inside
                // the iframe, so it goes stale as soon as the user switches threads.
                _setIframeSrc(src) {
                    const iframe = document.getElementById('agent-iframe');
                    if (!iframe) return null;
                    iframe.src = src;
                    return iframe;
                },

                updateContext() {
                    // Read context from a data attribute on #main-content or its first child
                    const el = document.querySelector('[data-dashboard-context]');
                    if (el) {
                        try {
                            const newCtx = JSON.parse(el.dataset.dashboardContext);
                            const newJson = JSON.stringify(newCtx);
                            // Only push when the context actually changed
                            if (newJson === this._lastContextJson) return;
                            this._lastContextJson = newJson;
                            this.currentContext = newCtx;

                            // Thread routing keys off identity only. The RFQ context also
                            // carries status/item_count/specific_count, which change on every
                            // agent mutation — and _notify_rfq_updated() fires a
                            // dashboard_refresh after each one. Re-running the routing on that
                            // churn reloaded the iframe mid-conversation, dropping the chat
                            // session and producing "Failed to upload X: Session not found".
                            const identity = JSON.stringify([
                                newCtx.view, newCtx.entity, newCtx.id, newCtx.thread_id,
                            ]);
                            const identityChanged = identity !== this._lastContextIdentity;
                            this._lastContextIdentity = identity;

                            if (identityChanged) {
                                // Switch the chat iframe to the RFQ's bound thread
                                if (newCtx.thread_id && newCtx.thread_id !== this._activeThreadId) {
                                    const iframe = this._setIframeSrc('/chat/thread/' + newCtx.thread_id);
                                    if (iframe) {
                                        this._activeThreadId = newCtx.thread_id;
                                        // Flag: we expect the iframe to load this specific thread.
                                        // If Chainlit reports a different thread_id back, it means
                                        // the bound thread couldn't be resumed (stale/deleted).
                                        this._expectingBoundThread = newCtx.thread_id;
                                    }
                                    // Track which RFQ owns this thread
                                    this._activeThreadRfqId = newCtx.id;
                                    // Auto-open the agent panel
                                    if (this.agentState === 'closed') {
                                        this.agentState = 'panel';
                                    }
                                }
                                // No thread bound yet for this RFQ — create one on demand
                                if (newCtx.view === 'rfq_detail' && newCtx.id && !newCtx.thread_id) {
                                    // If the active thread belongs to a different RFQ, don't reuse it
                                    if (this._activeThreadId && this._activeThreadRfqId && this._activeThreadRfqId !== newCtx.id) {
                                        // Start a fresh thread for this new RFQ
                                        console.log('[bind] Active thread belongs to', this._activeThreadRfqId, '— starting fresh for', newCtx.id);
                                        this._activeThreadId = null;
                                        this._activeThreadRfqId = null;
                                    }
                                    if (this._activeThreadId) {
                                        this._ensureRfqBound();
                                    } else {
                                        this._pendingRfqBind = newCtx.id;
                                        // Track whether this is a brand-new blank RFQ
                                        this._pendingNewRfq = !newCtx.customer;
                                        this._setIframeSrc('/chat');
                                    }
                                    if (this.agentState === 'closed') {
                                        this.agentState = 'panel';
                                    }
                                }
                            }
                        } catch (e) {
                            this.currentContext = {};
                        }
                    }
                    this.pushContext();
                },

                pushContext() {
                    // Unwrap Alpine proxy to a plain object for postMessage/fetch
                    const ctx = JSON.parse(JSON.stringify(this.currentContext));
                    // Include the active thread so the iframe can detect mismatches
                    ctx._activeThreadId = this._activeThreadId || null;
                    const iframe = document.getElementById('agent-iframe');
                    if (iframe?.contentWindow) {
                        iframe.contentWindow.postMessage({
                            type: 'dashboard_context',
                            payload: ctx
                        }, window.location.origin);
                    }
                    // The iframe listener (embedded.js) will push to the server,
                    // so we don't need to duplicate the POST here.
                },

                updateActiveNav() {
                    // Highlight active nav link based on current URL
                    const path = window.location.pathname;
                    document.querySelectorAll('.nav-link').forEach(link => {
                        const href = link.getAttribute('href');
                        const isActive = path === href || path.startsWith(href + '/');
                        link.classList.toggle('bg-blue-50', isActive);
                        link.classList.toggle('text-blue-700', isActive);
                        link.classList.toggle('dark:bg-blue-900/30', isActive);
                        link.classList.toggle('dark:text-blue-300', isActive);
                        link.classList.toggle('text-gray-500', !isActive);
                        link.classList.toggle('hover:text-gray-700', !isActive);
                        link.classList.toggle('hover:bg-gray-100', !isActive);
                        link.classList.toggle('dark:text-gray-400', !isActive);
                        link.classList.toggle('dark:hover:text-gray-200', !isActive);
                        link.classList.toggle('dark:hover:bg-gray-700', !isActive);
                    });
                },

                _ensureRfqBound() {
                    // If we're on an RFQ detail with no bound thread and we have
                    // an active thread, bind it immediately. Called from multiple
                    // points to guarantee binding regardless of message timing.
                    // Only bind threads from the Eagle Agent profile.
                    if (this._chatProfile !== 'Eagle Agent') return;
                    const ctx = this.currentContext;
                    if (ctx?.view === 'rfq_detail' && ctx?.id && !ctx?.thread_id && this._activeThreadId) {
                        const rfqId = ctx.id;
                        const threadId = this._activeThreadId;
                        console.log('[bind] Auto-binding thread', threadId, 'to', rfqId);
                        fetch('/api/rfq-thread', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            credentials: 'same-origin',
                            body: JSON.stringify({rfq_id: rfqId, thread_id: threadId}),
                        }).then(resp => {
                            if (resp.ok) {
                                this.currentContext.thread_id = threadId;
                                this._activeThreadRfqId = rfqId;
                                this.pushContext();
                            } else if (resp.status === 409) {
                                // Thread is already bound to another RFQ — start a fresh thread
                                console.log('[bind] Thread already bound to another RFQ, starting fresh');
                                this._activeThreadId = null;
                                this._setIframeSrc('/chat');   // deliberately a fresh session
                                // The new thread_id message from the iframe will trigger _ensureRfqBound again
                            }
                        }).catch(() => {});
                    }
                }
            };
        }

        // Shared email fetch + render — used by emailViewer and admin emailModal
        function _fetchEmailBody(messageId, onSuccess, onError) {
            fetch('/api/email-body/' + messageId).then(function(r) { return r.json(); }).then(function(d) {
                if (d.status === 'ok') {
                    var html = d.body ? marked.parse(d.body) : '';
                    var quoted = d.quoted ? marked.parse(d.quoted) : '';
                    var attach = (d.attachments||[])
                        .filter(function(a) { return !a.inline; })
                        .map(function(a) { return '<a href="/api/gmail/attachments/' + messageId + '/' + a.gmail_attachment_id + '"'
                            + ' class="inline-flex items-center gap-1 text-[14px] px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30"'
                            + ' download="' + a.filename + '">\uD83D\uDCCE ' + a.filename + '</a>'; }).join('');
                    onSuccess({bodyHtml: html, quotedHtml: quoted, attachHtml: attach});
                } else {
                    onError(d.message || 'Failed to load');
                }
            }).catch(function() { onError('Email no longer available in Gmail'); });
        }

        // Shared email viewer modal — used by RFQ comms tab and admin emails page
        function emailViewer() {
            return {
                show: false,
                email: {},
                bodyHtml: '', quotedHtml: '', attachHtml: '',
                loading: false, error: '',
                init() { window._openEmailViewer = this.open.bind(this); },
                open(meta) {
                    this.email = meta || {};
                    this.bodyHtml = ''; this.quotedHtml = ''; this.attachHtml = '';
                    this.loading = true; this.error = '';
                    this.show = true;
                    var messageId = this.email.messageId;
                    if (!messageId) { this.loading = false; this.error = 'No message ID'; return; }
                    var self = this;
                    _fetchEmailBody(messageId,
                        function(result) {
                            self.bodyHtml = result.bodyHtml;
                            self.quotedHtml = result.quotedHtml;
                            self.attachHtml = result.attachHtml;
                            self.loading = false;
                        },
                        function(err) { self.error = err; self.loading = false; }
                    );
                },
                close() { this.show = false; }
            };
        }

        // Append human 'time ago' labels to date spans emitted by the AI summary
        function _decorateTimeAgo(root) {
            if (!root) return;
            root.querySelectorAll('.ts[data-ts]').forEach(function(el) {
                var t = parseInt(el.getAttribute('data-ts'), 10);
                if (!t) return;
                var diff = (Date.now() / 1000) - t;
                if (diff < 0) return;  // future timestamps: leave as-is
                var label;
                if (diff < 60) label = 'just now';
                else if (diff < 3600) label = Math.floor(diff / 60) + 'm ago';
                else if (diff < 86400) label = (diff / 3600).toFixed(1).replace(/\.0$/, '') + 'h ago';
                else if (diff < 7 * 86400) label = (diff / 86400).toFixed(1).replace(/\.0$/, '') + ' days ago';
                else label = Math.round(diff / (7 * 86400)) + 'w ago';
                el.insertAdjacentHTML('afterend', ' <span class="ts-ago">(' + label + ')</span>');
            });
        }

        // AI communications summary modal — used by the RFQ comms tab
        function aiSummaryModal() {
            return {
                show: false,
                loading: false,
                refreshing: false,
                error: '',
                markdownHtml: '',
                meta: null,
                _rfqId: null,
                init() { window._openAiSummary = this.open.bind(this); },
                async open(rfqId, refresh) {
                    this.show = true;
                    this.loading = true;
                    this.refreshing = !!refresh;
                    this.error = '';
                    this.markdownHtml = '';
                    if (rfqId) this._rfqId = rfqId;
                    const self = this;
                    try {
                        const url = '/api/rfqs/' + this._rfqId + '/comms-summary' + (refresh ? '?refresh=1' : '');
                        const resp = await fetch(url, { credentials: 'same-origin' });
                        const data = await resp.json();
                        if (data.status !== 'ok') throw new Error(data.message || 'Failed to generate summary');
                        self.markdownHtml = marked.parse(data.markdown || '');
                        self.meta = data;
                        window.Alpine.nextTick(function() {
                            _decorateTimeAgo(document.getElementById('ai-summary-body'));
                        });
                    } catch (e) {
                        self.error = e.message;
                    } finally {
                        self.loading = false;
                        self.refreshing = false;
                    }
                },
                refresh() {
                    if (this.loading || !this._rfqId) return;
                    this.open(null, true);
                },
                close() { this.show = false; }
            };
        }

        // RFQ summary modal — shows the markdown summary the agent sees
        function rfqSummaryModal() {
            return {
                show: false,
                loading: false,
                error: '',
                markdownHtml: '',
                init() { window._openRfqSummary = this.open.bind(this); },

        function rfqDetail() {
            return {
                expanded: {},
                allExpanded: false,
                openPopover: null,
                editingHeader: false,
                editingItem: null,
                addingItem: false,
                agentBusy: false,
                editAllMode: false,
                editAllItems: [],
                editAllOriginals: {},
                editAllSaving: false,
                editAllMsg: '',
                editAllError: false,
                editAllDirtyCount: 0,
                syncMsg: '',
                departments: [],
                copySupplierModal: { open: false, sourceLine: null, supplierName: '', items: [] },
                brandSuppliersModal: { open: false, line: null, brand: '', suppliers: [] },
                rfqId: '',
                trackingId: '',
                userEmail: '',
                _allLines: [],
                _items: {},
                _unmatchedItems: [],
                init() {
                    var dataEl = document.getElementById('rfq-data');
                    var data = dataEl ? JSON.parse(dataEl.textContent) : {};
                    this.rfqId = data.rfqId || '';
                    this.trackingId = data.trackingId || this.rfqId || '';
                    this.userEmail = data.userEmail || '';
                    this.emailModal.userEmail = this.userEmail;
                    this.emailModal.trackingId = this.trackingId;
                    this._allLines = data.allLines || [];
                    this._unmatchedItems = data.unmatched || [];
                    this.departments = data.departments || [];
                    // Index items by line number for quick lookup
                    (data.items || []).forEach(i => this._items[i.line] = i);
                    // Auto-open header edit form for blank RFQs (no customer yet)
                    var ctxEl = document.querySelector('[data-dashboard-context]');
                    if (ctxEl) {
                        try {
                            var ctx = JSON.parse(ctxEl.dataset.dashboardContext);
                            if (ctx.header_auto_edit && !ctx.customer) {
                                this.editingHeader = true;
                            }
                        } catch(e) {}
                    }
                    var supplierLines = data.supplierLines || [];
                    // Restore expanded state from sessionStorage
                    var saved = {};
                    try { saved = JSON.parse(sessionStorage.getItem('rfq-expanded-' + this.rfqId) || '{}'); } catch(e) {}
                    supplierLines.forEach(l => this.expanded[l] = !!saved[l]);
                    this.checkAllExpanded();

                    // Listen for agent-working/agent_done events from Chainlit
                    // Batch buttons are disabled while agent is busy;
                    // per-item buttons remain enabled (concurrent use is valid).
                    var self = this;
                    window.addEventListener('message', function(e) {
                        if (e.data?.type === 'agent_working') {
                            self.agentBusy = true;
                        }
                        if (e.data?.type === 'agent_done') {
                            self.agentBusy = false;
                        }
                    });

                    console.log('[rfqDetail] init, rfqId:', this.rfqId, 'items:', Object.keys(this._items).length);
                },
                _saveExpanded() {
                    try { sessionStorage.setItem('rfq-expanded-' + this.rfqId, JSON.stringify(this.expanded)); } catch(e) {}
                },
                _restoreScroll(sx) {
                    document.addEventListener('htmx:afterSettle', function restore() {
                        var w = document.querySelector('#quotation-container .overflow-x-auto');
                        if (w) w.scrollLeft = sx;
                        document.removeEventListener('htmx:afterSettle', restore);
                    });
                },
                toggle(line) {
                    this.expanded[line] = !this.expanded[line];
                    this.checkAllExpanded();
                    this._saveExpanded();
                },
                expandAll() {
                    this._allLines.forEach(l => this.expanded[l] = true);
                    this.allExpanded = true;
                    this._saveExpanded();
                },
                collapseAll() {
                    this._allLines.forEach(l => this.expanded[l] = false);
                    this.allExpanded = false;
                    this._saveExpanded();
                },
                checkAllExpanded() {
                    var keys = Object.keys(this.expanded);
                    this.allExpanded = keys.length > 0 && keys.every(k => this.expanded[k]);
                },
                enterEditAll() {
                    // Build editable copies and store originals for dirty tracking
                    var items = [];
                    var originals = {};
                    this._allLines.forEach(l => {
                        var src = this._items[l];
                        if (src) {
                            var row = {
                                line: src.line,
                                part_number: src.part_number || '',
                                input_description: src.input_description || '',
                                brand: src.brand || '',
                                quantity: src.quantity != null ? String(src.quantity) : '',
                                uom: src.uom || '',
                                department_id: src.department_id || ''
                            };
                            items.push(row);
                            originals[src.line] = {
                                part_number: row.part_number,
                                input_description: row.input_description,
                                brand: row.brand,
                                quantity: row.quantity,
                                uom: row.uom,
                                department_id: row.department_id
                            };
                        }
                    });
                    this.editAllItems = items;
                    this.editAllOriginals = originals;
                    this.editAllMode = true;
                    this.editAllSaving = false;
                    this.editAllMsg = '';
                    this.editAllError = false;
                    this.editAllDirtyCount = 0;
                },
                isEditAllDirty(line, field) {
                    var orig = this.editAllOriginals[line];
                    if (!orig) return false;
                    var item = this.editAllItems.find(i => i.line === line);
                    if (!item) return false;
                    return (item[field] || '') !== (orig[field] || '');
                },
                updateDirtyCount() {
                    var count = 0;
                    var self = this;
                    this.editAllItems.forEach(item => {
                        var orig = self.editAllOriginals[item.line];
                        if (!orig) return;
                        var fields = ['part_number', 'input_description', 'brand', 'quantity', 'uom', 'department_id'];
                        for (var i = 0; i < fields.length; i++) {
                            if ((item[fields[i]] || '') !== (orig[fields[i]] || '')) { count++; break; }
                        }
                    });
                    this.editAllDirtyCount = count;
                },
                cancelEditAll() {
                    this.editAllMode = false;
                    this.editAllItems = [];
                    this.editAllOriginals = {};
                    this.editAllMsg = '';
                    this.editAllError = false;
                    this.editAllDirtyCount = 0;
                },
                async saveEditAll() {
                    this.editAllSaving = true;
                    this.editAllMsg = '';
                    this.editAllError = false;
                    try {
                        var resp = await fetch('/partial/rfqs/' + this.rfqId + '/bulk-update-items', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            credentials: 'same-origin',
                            body: JSON.stringify({ items: this.editAllItems })
                        });
                        if (resp.ok) {
                            // Replace the page content with the re-rendered detail partial
                            var html = await resp.text();
                            document.getElementById('main-content').innerHTML = html;
                            htmx.process(document.getElementById('main-content'));
                        } else {
                            var data = await resp.json().catch(function() { return {}; });
                            this.editAllMsg = data.message || 'Save failed';
                            this.editAllError = true;
                        }
                    } catch (e) {
                        this.editAllMsg = 'Request failed';
                        this.editAllError = true;
                    } finally {
                        this.editAllSaving = false;
                    }
                },
                _sendAction(action, refreshAfter) {
                    var rfqId = this.rfqId;
                    console.log('[bridge] sending action', action.name);
                    // Ensure thread is bound to the RFQ before dispatching
                    window.dispatchEvent(new CustomEvent('ensure-rfq-bound'));
                    // Inject the bound thread_id into the payload so the server
                    // pins messages to the correct thread even if the user has
                    // since navigated the chat iframe elsewhere.
                    var dashCtx = null;
                    try {
                        var ctxEl = document.querySelector('[data-dashboard-context]');
                        if (ctxEl) dashCtx = JSON.parse(ctxEl.dataset.dashboardContext);
                    } catch(e) {}
                    if (dashCtx && dashCtx.thread_id) {
                        action.payload = action.payload || {};
                        action.payload._thread_id = dashCtx.thread_id;
                    }
                    // Signal the dashboard that agent work has started
                    window.dispatchEvent(new CustomEvent('agent-working', { detail: { label: action.label || 'Agent working...' } }));
                    fetch('/api/agent-bridge', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({ action: action }),
                    }).then(function(resp) {
                        if (!resp.ok) resp.json().then(function(d) { console.error('[bridge]', d.error); });
                        else if (refreshAfter) {
                            htmx.ajax('GET', '/partial/rfqs/' + rfqId, { target: '#main-content' });
                        }
                    }).catch(function(err) {
                        console.error('[bridge]', err);
                    });
                },
                updateSupplier(rfqId, line, supplierName, status) {
                    this._sendAction({
                        name: 'rfq_update_supplier',
                        payload: { rfq_id: rfqId, line: line, supplier_name: supplierName, status: status }
                    }, true);
                },
                setSupplierStatus(line, supplierName, newStatus) {
                    fetch('/partial/rfqs/' + this.rfqId + '/update-supplier-status', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        credentials: 'same-origin',
                        body: 'line=' + line + '&supplier_name=' + encodeURIComponent(supplierName) + '&status=' + newStatus
                    }).catch(function(err) { console.error('[supplier-status]', err); });
                },
                identifyItems() {
                    // Rebuild unmatched list from current items (not stale initial load)
                    var unmatched = [];
                    for (var line in this._items) {
                        var item = this._items[line];
                        if (item && item.match === 'unmatched') {
                            unmatched.push({
                                line: item.line,
                                description: item.input_description,
                                part_number: item.part_number || item.input_code,
                                brand: item.brand
                            });
                        }
                    }
                    if (!unmatched.length) return;
                    var payload = {
                        rfq_id: this.rfqId,
                        items: unmatched
                    };
                    this._sendAction({ name: 'rfq_identify_items', label: 'Classifying & validating items...', payload: payload });
                },
                identifyItem(line) {
                    var item = this._items[line];
                    if (!item) { console.error('[rfqDetail] item not found for line', line); return; }
                    var payload = {
                        rfq_id: this.rfqId,
                        items: [{
                            line: item.line,
                            description: item.input_description,
                            part_number: item.part_number || item.input_code,
                            brand: item.brand
                        }]
                    };
                    this._sendAction({ name: 'rfq_identify_items', label: 'Classifying line ' + item.line + '...', payload: payload });
                },
                findSuppliers(line) {
                    var item = this._items[line];
                    if (!item) { console.error('[rfqDetail] item not found for line', line); return; }
                    var suppliers = (item.suppliers || []).filter(function(s) { return s.status !== 'dropped'; }).map(function(s) { return s.name; });
                    var payload = {
                        rfq_id: this.rfqId,
                        line: item.line,
                        description: item.input_description,
                        part_number: item.part_number || item.input_code,
                        brand: item.brand,
                        quantity: item.quantity,
                        uom: item.uom,
                        existing_suppliers: suppliers
                    };
                    this._sendAction({ name: 'rfq_find_suppliers', label: 'Finding suppliers for line ' + item.line + '...', payload: payload });
                },
                groupItems() {
                    var specificItems = [];
                    var self = this;
                    this._allLines.forEach(function(line) {
                        var item = self._items[line];
                        if (item && item.match === 'specific') {
                            specificItems.push({
                                line: item.line,
                                input_description: item.input_description,
                                part_number: item.part_number || item.input_code,
                                brand: item.brand
                            });
                        }
                    });
                    if (specificItems.length < 2) { return; }
                    var payload = {
                        rfq_id: this.rfqId,
                        items: specificItems
                    };
                    this._sendAction({ name: 'rfq_group_items', label: 'Grouping items...', payload: payload });
                },
                findAllSuppliers() {
                    // Legacy: runs both phases sequentially
                    var payload = this._buildSupplierPayload();
                    if (!payload) return;
                    this._sendAction({ name: 'rfq_find_all_suppliers', label: 'Finding suppliers for all items...', payload: payload });
                },
                findPreviousSuppliers() {
                    var payload = this._buildSupplierPayload();
                    if (!payload) return;
                    this._sendAction({ name: 'rfq_find_previous_suppliers', label: 'Searching our records...', payload: payload });
                },
                findBrandSuppliers() {
                    var payload = this._buildSupplierPayload();
                    if (!payload) return;
                    this._sendAction({ name: 'rfq_find_brand_suppliers', label: 'Finding brand-linked suppliers...', payload: payload });
                },
                findNewSuppliers() {
                    var payload = this._buildSupplierPayload();
                    if (!payload) return;
                    this._sendAction({ name: 'rfq_find_new_suppliers', label: 'Searching the web for new suppliers...', payload: payload });
                },
                _buildSupplierPayload() {
                    var supplierItems = [];
                    var self = this;
                    this._allLines.forEach(function(line) {
                        var item = self._items[line];
                        if (item && item.match !== 'unmatched') {
                            var suppliers = (item.suppliers || []).filter(function(s) { return s.status !== 'dropped'; }).map(function(s) { return s.name; });
                            supplierItems.push({
                                line: item.line,
                                description: item.input_description,
                                part_number: item.part_number || item.input_code,
                                brand: item.brand,
                                quantity: item.quantity,
                                uom: item.uom,
                                existing_suppliers: suppliers
                            });
                        }
                    });
                    if (supplierItems.length < 1) return null;
                    return { rfq_id: this.rfqId, items: supplierItems };
                },
                shortlistAll() {
                    var rfqId = this.rfqId;
                    fetch('/partial/rfqs/' + rfqId + '/shortlist-all', {

                dropSupplierAll(supplierName) {

                shortlistSupplierAll(supplierName) {

                copySupplierToAll(line, supplierName) {

                        method: 'POST',

                },
                openCopySupplierModal(sourceLine, supplierName) {
                    var items = this._items;
                    var nameLC = supplierName.toLowerCase();
                    var modalItems = [];
                    this._allLines.forEach(function(line) {
                        var item = items[line];
                        if (!item) return;
                        var already = false;
                        (item.suppliers || []).forEach(function(s) {
                            if ((s.name || '').toLowerCase() === nameLC) already = true;
                        });
                        modalItems.push({
                            line: item.line,
                            description: item.input_description || '(no description)',
                            part_number: item.part_number || '',
                            already: already,
                            selected: false
                        });
                    });
                    this.copySupplierModal = {
                        open: true,
                        sourceLine: sourceLine,
                        supplierName: supplierName,
                        items: modalItems
                    };
                },
                selectAllCopyItems() {
                    this.copySupplierModal.items.forEach(function(item) {
                        if (!item.already) item.selected = true;
                    });
                },
                submitCopySupplierToItems() {
                    var modal = this.copySupplierModal;
                    var targetLines = [];
                    modal.items.forEach(function(item) {
                        if (item.selected && !item.already) targetLines.push(item.line);
                    });
                    if (targetLines.length === 0) { modal.open = false; return; }
                    var rfqId = this.rfqId;
                    fetch('/partial/rfqs/' + rfqId + '/copy-supplier-to-items', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        credentials: 'same-origin',
                        body: 'line=' + modal.sourceLine + '&supplier_name=' + encodeURIComponent(modal.supplierName) + '&target_lines=' + encodeURIComponent(JSON.stringify(targetLines))
                    }).then(function(resp) {
                        if (resp.ok) {
                            htmx.ajax('GET', '/partial/rfqs/' + rfqId, { target: '#main-content' });
                        }
                    }).catch(function(err) { console.error('[copy-supplier-to-items]', err); });
                    modal.open = false;
                },
                openBrandSuppliersModal(line) {
                    var item = this._items[line];
                    if (!item) { console.error('[rfqDetail] item not found for line', line); return; }
                    // Build map of ALL suppliers on the item (including dropped) — for display only
                    var supplierMap = {};
                    (item.suppliers || []).forEach(function(s) {
                        supplierMap[(s.name || '').toLowerCase()] = s.status || 'candidate';
                    });
                    var brandSups = (item.brand_suppliers || []).map(function(s) {
                        var key = (s.name || '').toLowerCase();
                        var status = supplierMap[key];
                        return Object.assign({}, s, {
                            _onItem: !!status,
                            _status: status || 'none'
                        });
                    });
                    this.brandSuppliersModal = {
                        open: true,
                        line: line,
                        brand: item.brand || '',
                        suppliers: brandSups
                    };
                },
                closeBrandSuppliersModal() {
                    this.brandSuppliersModal.open = false;
                },
                toggleBrandSupplier(supplier) {
                    var rfqId = this.rfqId;
                    var line = this.brandSuppliersModal.line;
                    function refresh() {
                        htmx.ajax('GET', '/partial/rfqs/' + rfqId, { target: '#rfq-items-container', select: '#rfq-items-container' });
                    }
                    if (supplier._onItem) {
                        // Remove supplier from the line entirely
                        fetch('/partial/rfqs/' + rfqId + '/remove-supplier', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',
                            body: JSON.stringify({ line: line, supplier_name: supplier.name })
                        }).then(function() { refresh(); }).catch(function(err) { console.error('[remove-brand-supplier]', err); });
                        supplier._onItem = false;
                        supplier._status = 'none';
                    } else {
                        // Add supplier to the line
                        fetch('/partial/rfqs/' + rfqId + '/add-brand-supplier', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',
                            body: JSON.stringify({ line: line, supplier: supplier })
                        }).then(function() { refresh(); }).catch(function(err) { console.error('[add-brand-supplier]', err); });
                        supplier._onItem = true;
                        supplier._status = 'active';
                    }
                },

                updateSupplierQuote(line, supplierName, field, value, isSelected) {

                updateSupplierMeta(supplierName, field, value) {

                            supplier_name: supplierName,
