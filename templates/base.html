                },

                emailModal: {
                    isOpen: false,
                    isLoading: false,
                    mode: 'editor',
                    isExpanded: false,
                    _editor: null,
                    _tablePickerCleanup: null,
                    rfqId: null,
                    trackingId: "",
                    userEmail: "",
                    recipientEmail: "",
                    recipientName: "",
                    subject: "",
                    bodyHtml: "",
                    composeUrl: null,
                    error: null,
                    success: null,
                    attachments: [],   // [{upload_id, filename, size}]
                    uploading: false,
                    attachError: null,
                    attachDragOver: false,

                    _prepare(rfqId, recipientEmail, recipientName, subject, bodyHtml, trackingId = null, userEmail = null) {
                        this.rfqId = rfqId;
                        this.trackingId = trackingId || rfqId || "";
                        this.userEmail = userEmail || this.userEmail || "";
                        this.recipientEmail = recipientEmail;
                        this.recipientName = recipientName;
                        this.subject = subject || 'Quote Request';
                        this.bodyHtml = this._normalizeBodyHtml(this._withTrackingFooter(bodyHtml || ''));
                        this.mode = 'editor';
                        this.composeUrl = null;
                        this.error = null;
                        this.success = null;
                        this.attachments = [];
                        this.uploading = false;
                        this.attachError = null;
                        this.attachDragOver = false;
                    },

                    // Opens in-app editor path
                    open(rfqId, recipientEmail, recipientName, subject, bodyHtml, trackingId = null, userEmail = null) {
                        this._prepare(rfqId, recipientEmail, recipientName, subject, bodyHtml, trackingId, userEmail);
                        this.isOpen = true;
                        this.isLoading = false;
                        this._initEditorDeferred();
                    },

                    // One-click Gmail path (no in-app editing)
                    quickEditInGmail(rfqId, recipientEmail, recipientName, subject, bodyHtml, trackingId = null, userEmail = null) {
                        this._prepare(rfqId, recipientEmail, recipientName, subject, bodyHtml, trackingId, userEmail);
                        this.mode = 'busy';
                        this.isOpen = true;
                        this._saveDraft(true);
                    },

                    close() {
                        this._closeTablePicker();
                        this._destroyEditor();
                        this.isOpen = false;
                        this.isLoading = false;
                        this.mode = 'editor';
                        this.isExpanded = false;
                        this.rfqId = null;
                        this.trackingId = "";
                        this.recipientEmail = "";
                        this.recipientName = "";
                        this.subject = "";
                        this.bodyHtml = "";
                        this.composeUrl = null;
                        this.error = null;
                        this.success = null;
                        this.attachments = [];
                        this.uploading = false;
                        this.attachError = null;
                        this.attachDragOver = false;
                    },

                    uploadFiles(fileList) {
                        const files = Array.from(fileList || []);
                        if (!files.length) return;
                        this.uploading = true;
                        this.attachError = null;
                        const fd = new FormData();
                        for (const f of files) fd.append('files', f);
                        fetch('/api/email-uploads', {
                            method: 'POST',
                            body: fd,
                            credentials: 'same-origin',
                        })
                            .then(resp => resp.json())
                            .then(data => {
                                if (data.status !== 'ok') throw new Error(data.message || 'Upload failed');
                                this.attachments.push(...data.uploads);
                            })
                            .catch(e => { this.attachError = e.message; })
                            .finally(() => { this.uploading = false; });
                    },

                    removeAttachment(uploadId) {
                        this.attachments = this.attachments.filter(a => a.upload_id !== uploadId);
                        fetch(`/api/email-uploads/${uploadId}`, {
                            method: 'DELETE',
                            credentials: 'same-origin',
                        }).catch(() => {});
                    },

                    _attachmentPayload() {
                        return { attachments: this.attachments.map(a => ({ upload_id: a.upload_id })) };
                    },

                    _formatSize(size) {
                        const n = Number(size);
                        if (!n) return '0 B';
                        if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
                        if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
                        return n + ' B';
                    },

                    _initEditorDeferred() {
                        const initFn = () => this._initEditor();
                        if (window.Alpine && typeof Alpine.nextTick === 'function') {
                            Alpine.nextTick(initFn);
                        } else {
                            setTimeout(initFn, 0);
                        }
                    },

                    _initEditor() {
                        const self = this;
                        if (!window.Jodit) {
                            this.error = 'Rich editor failed to load. Please refresh the page.';
                            return;
                        }

                        if (this._editor) {
                            this._editor.value = self.bodyHtml || '';
                            return;
                        }

                        this._editor = Jodit.make('#email-editor', {
                            height: this.isExpanded ? 520 : 320,
                            toolbarAdaptive: false,
                            toolbarSticky: false,
                            saveSelectionOnBlur: true,
                            askBeforePasteHTML: false,
                            askBeforePasteFromWord: false,
                            defaultActionOnPaste: 'insert_as_html',
                            disablePlugins: 'ai-assistant',
                            buttons: [
                                'bold', 'italic', 'underline', '|',
                                'ul', 'ol', '|',
                                'outdent', 'indent', '|',
                                'brush', '|',
                                {
                                    name: 'insertStyledTable',
                                    icon: 'table',
                                    tooltip: 'Insert styled table',
                                    exec: (editor) => {
                                        self._openTablePicker(editor);
                                    }
                                },
                                'link', '|',
                                'align', '|',
                                'undo', 'redo'
                            ]
                        });
                        // Save cursor position when the editor loses focus (e.g. user
                        // clicks a toolbar button) so we can restore it for insertions.
                        // IMPORTANT: Do NOT save on 'keyup' — that interferes with native
                        // text selection behaviour (selecting text + typing/deleting would
                        // only affect the last character instead of the full selection).
                        this._editor.events.on('blur', () => {
                            // Skip if table picker is open — it will use _savedRange
                            if (this._tablePickerActive) return;
                            try { this._savedRange = this._editor.s.save(); } catch (_) {}
                        });
                        // Restore saved cursor only for toolbar-initiated commands (not
                        // for native keyboard commands which manage their own selection).
                        this._editor.events.on('beforeCommand', (command) => {
                            // Only restore for programmatic insertions (toolbar buttons)
                            if (this._savedRange) {
                                try { this._editor.s.restore(); } catch (_) {}
                            }
                        });
                        this._editor.value = self.bodyHtml || '';
                    },

                    toggleExpand() {
                        const currentHtml = this._getBodyHtml();
                        this.isExpanded = !this.isExpanded;
                        this.bodyHtml = currentHtml;
                        this._destroyEditor();
                        this._initEditorDeferred();
                    },

                    _destroyEditor() {
                        this._closeTablePicker();
                        if (this._editor && typeof this._editor.destruct === 'function') {
                            this._editor.destruct();
                        }
                        this._editor = null;
                    },

                    _getBodyHtml() {
                        if (this._editor) {
                            return this._editor.value || '';
                        }
                        return this.bodyHtml || '';
                    },

                    _withTrackingSubject(subject) {
                        const s = (subject || '').trim();
                        if (!this.trackingId || s.includes(this.trackingId)) return s;
                        return `[${this.trackingId}] ${s}`;
                    },

                    _withTrackingFooter(bodyHtml) {
                        if (!this.trackingId) return bodyHtml;
                        if (bodyHtml.includes(this.trackingId)) return bodyHtml;
                        const footer = `<p style="margin-top:16px;font-size:10px;line-height:1.2;color:#6b7280;">Tracking ID: ${this.trackingId}</p>`;
                        return `${bodyHtml}${footer}`;
                    },

                    _buildStyledTableHtml(colCount, rowCount) {
                        const ths = Array.from({ length: colCount }, (_, i) =>
                            `<th style="border: 1px solid #d1d5db; padding: 8px 12px; font-family: Arial, Helvetica, sans-serif; font-size: 14px; background-color: #f3f4f6;">Header ${i + 1}</th>`
                        ).join('');
                        const tds = Array.from({ length: colCount }, () =>
                            '<td style="border: 1px solid #d1d5db; padding: 8px 12px; font-family: Arial, Helvetica, sans-serif; font-size: 14px;">&nbsp;</td>'
                        ).join('');
                        const rows = Array.from({ length: rowCount }, () => `<tr>${tds}</tr>`).join('');
                        return `<table style="border-collapse: collapse; margin: 12px 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px;"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table><p></p>`;
                    },

                    _openTablePicker(editor) {
                        this._closeTablePicker();
                        if (!editor) return;
                        const self = this;

                        // Save cursor now (exec fires while editor still has selection).
                        // Flag prevents the blur handler from overwriting our markers.
                        this._tablePickerActive = true;
                        this._tableInsertMarkers = null;
                        try {
                            this._tableInsertMarkers = editor.s.save();
                        } catch (_) {}

                        const overlay = document.createElement('div');
                        overlay.style.position = 'fixed';
                        overlay.style.inset = '0';
                        overlay.style.background = 'rgba(0,0,0,0.15)';
                        overlay.style.zIndex = '100000';
                        overlay.style.display = 'flex';
                        overlay.style.alignItems = 'center';
                        overlay.style.justifyContent = 'center';

                        const panel = document.createElement('div');
                        panel.style.background = '#fff';
                        panel.style.border = '1px solid #d1d5db';
                        panel.style.borderRadius = '8px';
                        panel.style.padding = '10px';
                        panel.style.boxShadow = '0 12px 24px rgba(0,0,0,0.2)';
                        panel.style.width = 'fit-content';

                        const label = document.createElement('div');
                        label.textContent = 'Insert table: 1 x 1';
                        label.style.font = '600 13px Arial, sans-serif';
                        label.style.marginBottom = '8px';
                        panel.appendChild(label);

                        const grid = document.createElement('div');
                        grid.style.display = 'grid';
                        grid.style.gridTemplateColumns = 'repeat(6, 22px)';
                        grid.style.gap = '4px';

                        const cells = [];
                        for (let r = 1; r <= 6; r++) {
                            for (let c = 1; c <= 6; c++) {
                                const cell = document.createElement('button');
                                cell.type = 'button';
                                cell.dataset.rows = String(r);
                                cell.dataset.cols = String(c);
                                cell.style.width = '22px';
                                cell.style.height = '22px';
                                cell.style.border = '1px solid #cbd5e1';
                                cell.style.background = '#f8fafc';
                                cell.style.padding = '0';
                                cell.style.cursor = 'pointer';

                                cell.addEventListener('mouseenter', () => {
                                    label.textContent = `Insert table: ${r} x ${c}`;
                                    cells.forEach((btn) => {
                                        const rr = parseInt(btn.dataset.rows || '0', 10);
                                        const cc = parseInt(btn.dataset.cols || '0', 10);
                                        btn.style.background = rr <= r && cc <= c ? '#bfdbfe' : '#f8fafc';
                                        btn.style.borderColor = rr <= r && cc <= c ? '#60a5fa' : '#cbd5e1';
                                    });
                                });

                                cell.addEventListener('click', (ev) => {
                                    ev.preventDefault();
                                    // Close picker first so the overlay is gone
                                    self._closeTablePicker();
                                    self._tablePickerActive = false;
                                    // Restore cursor from markers saved when picker opened
                                    try { editor.s.restore(); } catch (_) {}
                                    self._tableInsertMarkers = null;
                                    editor.s.focus();
                                    editor.s.insertHTML(self._buildStyledTableHtml(c, r));
                                });

                                cells.push(cell);
                                grid.appendChild(cell);
                            }
                        }
                        panel.appendChild(grid);

                        const help = document.createElement('div');
                        help.textContent = 'Click outside to cancel';
                        help.style.font = '12px Arial, sans-serif';
                        help.style.color = '#64748b';
                        help.style.marginTop = '8px';
                        panel.appendChild(help);

                        overlay.addEventListener('click', (ev) => {
                            if (ev.target === overlay) this._closeTablePicker();
                        });
                        panel.addEventListener('click', (ev) => ev.stopPropagation());

                        overlay.appendChild(panel);
                        document.body.appendChild(overlay);

                        this._tablePickerCleanup = () => {
                            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                            this._tablePickerCleanup = null;
                        };
                    },

                    _closeTablePicker() {
                        this._tablePickerActive = false;
                        if (typeof this._tablePickerCleanup === 'function') {
                            this._tablePickerCleanup();
                        }
                    },

                    _normalizeBodyHtml(bodyHtml) {
                        if (!bodyHtml) {
                            return '<div style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.45;"></div>';
                        }
                        if (typeof DOMParser === 'undefined') return bodyHtml;

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(`<div id="email-root">${bodyHtml}</div>`, 'text/html');
                        const root = doc.getElementById('email-root');
                        if (!root) return bodyHtml;

                        const stripFontStyle = (value) => {
                            if (!value) return '';
                            return value
                                .replace(/font-size\s*:[^;]+;?/gi, '')
                                .replace(/font-family\s*:[^;]+;?/gi, '')
                                .replace(/\s{2,}/g, ' ')
                                .trim();
                        };

                        const nodes = root.querySelectorAll('*');
                        nodes.forEach((el) => {
                            const cleaned = stripFontStyle(el.getAttribute('style') || '');
                            if (cleaned) {
                                el.setAttribute('style', cleaned);
                            } else {
                                el.removeAttribute('style');
                            }
                        });

                        root.querySelectorAll('table').forEach((el) => {
                            const base = el.getAttribute('style') || '';
                            el.setAttribute('style', `${base}${base && !base.trim().endsWith(';') ? ';' : ''}font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.45; border-collapse: collapse; margin: 0 0 12px 0;`);
                        });

                        root.querySelectorAll('th').forEach((el) => {
                            const base = el.getAttribute('style') || '';
                            el.setAttribute('style', `${base}${base && !base.trim().endsWith(';') ? ';' : ''}font-family: Arial, Helvetica, sans-serif; font-size: 14px; border: 1px solid #d1d5db; padding: 8px 12px; background-color: #f3f4f6;`);
                        });

                        root.querySelectorAll('td').forEach((el) => {
                            const base = el.getAttribute('style') || '';
                            el.setAttribute('style', `${base}${base && !base.trim().endsWith(';') ? ';' : ''}font-family: Arial, Helvetica, sans-serif; font-size: 14px; border: 1px solid #d1d5db; padding: 8px 12px;`);
                        });

                        root.querySelectorAll('p, li, div, span, a').forEach((el) => {
                            const base = el.getAttribute('style') || '';
                            el.setAttribute('style', `${base}${base && !base.trim().endsWith(';') ? ';' : ''}font-family: Arial, Helvetica, sans-serif; font-size: 14px;`);
                        });

                        root.setAttribute('style', 'font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.45; color: #111827;');
                        return root.outerHTML;
                    },

                    openPopup() {
                        if (this.composeUrl) {
                            window.open(this.composeUrl, 'gmail_compose', 'width=960,height=720,left=200,top=80');
                        }
                    },

                    async sendDirect() {
                        this.isLoading = true;
                        this.error = null;
                        this.success = null;
                        try {
                            const bodyHtml = this._normalizeBodyHtml(this._withTrackingFooter(this._getBodyHtml()));
                            const response = await fetch(`/api/rfqs/${this.rfqId}/send-email-direct`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    recipient_email: this.recipientEmail,
                                    recipient_name: this.recipientName,
                                    subject: (this.trackingId ? '[' + this.trackingId + '] ' : '') + this.subject,
                                    body_html: bodyHtml,
                                    ...this._attachmentPayload(),
                                }),
                            });
                            const data = await response.json();
                            if (data.status !== 'ok') throw new Error(data.message || 'Failed to send email');
                            this.success = data.message || 'Email sent successfully';
                            this.mode = 'result';
                        } catch (err) {
                            this.error = err.message || 'Failed to send email';
                        } finally {
                            this.isLoading = false;
                        }
                    },

                    async saveToDraftInGmail() {
                        await this._saveDraft(false);
                    },

                    async editDraftInGmail() {
                        await this._saveDraft(true);
                    },

                    async _saveDraft(openAfter) {
                        this.isLoading = true;
                        this.error = null;
                        this.composeUrl = null;
                        try {
                            const bodyHtml = this._normalizeBodyHtml(this._withTrackingFooter(this._getBodyHtml()));
                            const response = await fetch(`/api/rfqs/${this.rfqId}/send-email-draft`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    recipient_email: this.recipientEmail,
                                    recipient_name: this.recipientName,
                                    subject: (this.trackingId ? '[' + this.trackingId + '] ' : '') + this.subject,
                                    body_html: bodyHtml,
                                    ...this._attachmentPayload(),
                                }),
                            });
                            const data = await response.json();
                            if (data.status !== 'ok') throw new Error(data.message || 'Failed to create draft');
                            this.composeUrl = data.compose_url;
                            // Refresh email-suppliers panel so green dot shows immediately
                            htmx.ajax('GET', `/partial/rfqs/${this.rfqId}/email-suppliers`, {
                                target: '#email-suppliers-panel',
                                swap: 'innerHTML',
                            });
                            this.success = openAfter
                                ? (data.message || 'Draft created and opened in Gmail')
                                : 'Draft saved to Gmail successfully';
                            this.mode = 'result';
                            if (openAfter) this.openPopup();
                        } catch (err) {
                            this.error = err.message || 'Failed to create draft';
                        } finally {
                            this.isLoading = false;
                        }
                    }
                },

                // ── Smart Item Adder ──
                smartAddOpen: false,
                dragOver: false,
                extracting: false,
                adding: false,
                pasteHtml: null,
                pasteText: null,
                imageBase64: null,
                previewItems: [],
                headers: [],
                fields: [],        // ordered field keys parallel to headers — used for x-model binding
                columnMapping: {},
                warnings: [],
                extractionError: null,  // shown inline when extraction produces no items

                // Column width presets for the preview table
                fieldWidth(field) {
                    var widths = {
                        'input_description': '',      // flex — takes remaining space
                        'input_code': 'width: 120px', // ~60% narrower
                        'brand': 'width: 90px',       // ~50% narrower
                        'quantity': 'width: 56px',    // compact
                        'uom': 'width: 56px',         // compact
                    };
                    return widths[field] || '';
                },
                thWidth(header) {
                    var h = (header || '').toLowerCase();
                    if (h.indexOf('description') !== -1 || h.indexOf('item') !== -1) return '';
                    if (h.indexOf('part') !== -1 || h.indexOf('code') !== -1 || h.indexOf('sku') !== -1) return 'width:120px';
                    if (h.indexOf('brand') !== -1 || h.indexOf('make') !== -1 || h.indexOf('mfr') !== -1) return 'width:90px';
                    if (h.indexOf('qty') !== -1 || h.indexOf('quantity') !== -1) return 'width:56px';
                    if (h.indexOf('uom') !== -1 || h.indexOf('unit') !== -1) return 'width:56px';
                    return '';
                },

                get hasContent() {
                    return !!(this.pasteHtml || this.pasteText || this.imageBase64);
                },

                // Paste handler — captures HTML tables, images, and plain text.
                // Content is rendered inline so the user can see what was pasted.
                handlePaste(event) {
                    var clipboard = event.clipboardData;
                    if (!clipboard) return;

                    // Check for image files first (clipboard screenshot)
                    var files = clipboard.files;
                    if (files && files.length > 0 && files[0].type.startsWith('image/')) {
                        event.preventDefault();
                        this._insertImageIntoArea(files[0]);
                        return;
                    }

                    // Capture HTML for server-side parsing
                    var html = clipboard.getData('text/html');
                    if (html && html.includes('<table')) {
                        // Let browser render the table — don't preventDefault.
                        // The user sees the table in the paste area.
                        // Capture a snapshot AFTER the browser inserts it.
                        var self = this;
                        setTimeout(function() {
                            self.pasteHtml = self.$refs.pasteArea.innerHTML;
                            self.pasteText = self.$refs.pasteArea.innerText || '';
                        }, 50);
                    }
                    // For plain text: default browser behavior inserts it — user sees it.
                    // handleInput will capture the text value.
                },

                // Capture plain text as the user types or pastes plain text
                handleInput(event) {
                    // Only capture after paste HTML handler has had time to run
                    var self = this;
                    setTimeout(function() {
                        self.pasteText = self.$refs.pasteArea.innerText || '';
                    }, 100);
                },

                // Drag and drop handler — renders images inline, reads text files, captures HTML tables
                handleDrop(event) {
                    this.dragOver = false;
                    var files = event.dataTransfer.files;
                    if (files.length > 0) {
                        var file = files[0];
                        if (file.type.startsWith('image/')) {
                            this._insertImageIntoArea(file);
                            return;
                        }
                        if (this._isTextFile(file)) {
                            this._readTextFile(file);
                            return;
                        }
                    }
                    // Let the browser handle HTML/text drops — content appears in the div.
                    var self = this;
                    setTimeout(function() {
                        self.pasteHtml = self.$refs.pasteArea.innerHTML;
                        self.pasteText = self.$refs.pasteArea.innerText || '';
                    }, 50);
                },

                // Insert an image file into the paste area so the user can see it
                _insertImageIntoArea(file) {
                    var self = this;
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        self.imageBase64 = e.target.result;
                        // Show the image inline in the paste area
                        var area = self.$refs.pasteArea;
                        area.innerHTML = '';
                        var img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.maxWidth = '100%';
                        img.style.maxHeight = '250px';
                        img.style.borderRadius = '4px';
                        img.alt = file.name || 'Screenshot';
                        area.appendChild(img);
                        area.classList.add('has-content');
                    };
                    reader.readAsDataURL(file);
                },

                // Check if a file is a supported text format (.txt, .csv)
                _isTextFile(file) {
                    var name = (file.name || '').toLowerCase();
                    return name.endsWith('.txt') || name.endsWith('.csv');
                },

                // Read a text file and populate pasteText + show preview in paste area
                _readTextFile(file) {
                    var self = this;
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        self.pasteText = e.target.result;
                        self.pasteHtml = null;
                        self.imageBase64 = null;
                        // Show a preview of the file content in the paste area
                        var area = self.$refs.pasteArea;
                        area.innerHTML = '';
                        var pre = document.createElement('pre');
                        pre.style.whiteSpace = 'pre-wrap';
                        pre.style.fontFamily = 'monospace';
                        pre.style.fontSize = '12px';
                        pre.style.margin = '0';
                        pre.style.maxHeight = '250px';
                        pre.style.overflowY = 'auto';
                        // Show first 2000 chars as preview
                        pre.textContent = e.target.result.substring(0, 2000);
                        if (e.target.result.length > 2000) {
                            pre.textContent += '\n\n... (truncated preview)';
                        }
                        area.appendChild(pre);
                        area.classList.add('has-content');
                    };
                    reader.readAsText(file);
                },

                // File upload button handler — routes to image or text reader
                handleFileUpload(event) {
                    var file = event.target.files[0];
                    if (!file) return;
                    if (file.type.startsWith('image/')) {
                        this._insertImageIntoArea(file);
                    } else if (this._isTextFile(file)) {
                        this._readTextFile(file);
                    }
                    // Reset the input so the same file can be re-selected
                    event.target.value = '';
                },

                // Read image as base64 (for backward compat with any external calls)
                readImageFile(file) {
                    if (!file.type.startsWith('image/')) {
                        alert('Please use an image file (PNG, JPG, etc.)');
                        return;
                    }
                    this._insertImageIntoArea(file);
                },

                // Call extract endpoint
                extractionError: null,  // shown inline when extraction produces no items

                async extractItems() {
                    this.extracting = true;
                    this.warnings = [];
                    this.extractionError = null;

                    try {
                        var body = {};
                        if (this.pasteHtml) body.html = this.pasteHtml;
                        if (this.imageBase64) body.image_base64 = this.imageBase64;
                        if (this.pasteText) body.plain_text = this.pasteText;

                        var resp = await fetch('/api/rfq/' + this.rfqId + '/extract-items', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body),
                        });

                        if (!resp.ok) {
                            var errText = 'Unknown error';
                            try {
                                var errJson = await resp.json();
                                errText = errJson.detail || errJson.message || errText;
                            } catch (_) {
                                // Response wasn't JSON (e.g., HTML error page)
                                var raw = await resp.text();
                                errText = raw.substring(0, 200) || 'HTTP ' + resp.status;
                            }
                            throw new Error(errText);
                        }

                        var data = await resp.json();
                        this.previewItems = data.items || [];
                        this.headers = data.headers || [];
                        this.fields = data.fields || [];
                        this.columnMapping = data.column_mapping || {};
                        this.warnings = data.warnings || [];

                        if (!this.previewItems.length) {
                            var reasons = [];
                            if (data.content_type) reasons.push('Content type: ' + data.content_type);
                            if (data.warnings && data.warnings.length) {
                                reasons = reasons.concat(data.warnings);
                            }
                            if (data._debug) {
                                reasons.push('--- Raw Gemini response ---');
                                reasons.push('Headers: ' + JSON.stringify(data._debug.raw_parsed_json.headers));
                                reasons.push('First item keys: ' + JSON.stringify(
                                    data._debug.raw_parsed_json.items && data._debug.raw_parsed_json.items[0]
                                        ? Object.keys(data._debug.raw_parsed_json.items[0]) : 'N/A'));
                                reasons.push('Column mapping: ' + JSON.stringify(data._debug.column_mapping));
                                reasons.push('Header→field: ' + JSON.stringify(data._debug.header_to_field));
                            }
                            if (!reasons.length) {
                                reasons.push('No recognizable table, columns, or items found in the pasted content.');
                            }
                            this.extractionError = reasons.join('<br>');
                        }
                    } catch (e) {
                        this.extractionError = 'Server error: ' + e.message;
                    } finally {
                        this.extracting = false;
                    }
                },

                // Confirm and add items to RFQ
                async confirmAdd() {
                    this.adding = true;

                    try {
                        var resp = await fetch('/api/rfq/' + this.rfqId + '/items/bulk', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ items: this.previewItems }),
                        });

                        if (!resp.ok) {
                            var err = await resp.json();
                            throw new Error(err.detail || 'Failed to add items');
                        }

                        // Close modal, reset state
                        this.smartAddOpen = false;
                        this.resetExtraction();

                        // Reload the RFQ detail page to show new items
                        htmx.ajax('GET', '/partial/rfqs/' + this.rfqId, { target: '#main-content' });
                    } catch (e) {
                        alert('Error adding items: ' + e.message);
                    } finally {
                        this.adding = false;
                    }
                },

                resetExtraction() {
                    this.previewItems = [];
                    this.headers = [];
                    this.fields = [];
                    this.columnMapping = {};
                    this.warnings = [];
                    this.extractionError = null;
                    this.pasteHtml = null;
                    this.pasteText = null;
                    this.imageBase64 = null;
                    if (this.$refs.pasteArea) {
                        this.$refs.pasteArea.innerHTML = '';
                        this.$refs.pasteArea.classList.remove('has-content');
                    }
                },
            };
        }
    </script>
    <script>
    // RFQ communications: shared expand/collapse state so poll refreshes
    // don't collapse the threads the user is reading. Supports multiple
    // expanded threads plus expand/collapse-all.
    document.addEventListener('alpine:init', () => {
        Alpine.store('comms', {
            expanded: [],
            isOpen(id) { return this.expanded.includes(id); },
            toggle(id) {
                const i = this.expanded.indexOf(id);
                if (i === -1) this.expanded.push(id); else this.expanded.splice(i, 1);
            },
            expandAll(ids) {
                this.expanded = Array.from(new Set([...this.expanded, ...(ids || [])]));
            },
            collapseAll() { this.expanded = []; }
        });
    });
    </script>
    <script>
    // Bulk compose modal — registered before Alpine scans the DOM.
    // Uses alpine:init (not DOMContentLoaded) so the component exists when
    // Alpine encounters x-data="bulkComposeModal".
    document.addEventListener('alpine:init', () => {
        Alpine.data('bulkComposeModal', () => ({
            isOpen: false,
            isLoading: false,
            isSending: false,
            mode: 'editor',
            _editor: null,
            rfqId: null,
            opportunityId: null,
            trackingId: "",
            userEmail: "",
            userName: "",
            userSignature: "",
            subject: "",
            recipients: [],
            sendResults: [],
            okCount: 0,
            failCount: 0,
            error: null,
            attachments: [],   // shared across all recipients
            uploading: false,
            attachError: null,

            init() {
                window.__bulkComposeOpen = (selectedSuppliers, rfqId, opportunityId) => {
                    this.open(selectedSuppliers, rfqId, opportunityId);
                };
            },

            open(selectedSuppliers, rfqId, opportunityId) {
                if (window.__bulkUser) {
                    this.userEmail = window.__bulkUser.email || '';
                    this.userName = window.__bulkUser.name || '';
                }
                this.recipients = selectedSuppliers;
                this.rfqId = rfqId;
                this.opportunityId = opportunityId || null;
                this.trackingId = opportunityId || rfqId || "";
                this.subject = 'Quotation Request: Eagle Exports';
                this.sendResults = [];
                this.okCount = 0;
                this.failCount = 0;
                this.error = null;
                this.attachments = [];
                this.uploading = false;
                this.attachError = null;
                this.mode = 'editor';
                this.isOpen = true;
                this.$nextTick(() => this._initEditor());
            },

            close() {
                this._destroyEditor();
                this.isOpen = false;
                this.mode = 'editor';
                this.recipients = [];
                this.sendResults = [];
                this.okCount = 0;
                this.failCount = 0;
                this.error = null;
                this.attachments = [];
                this.uploading = false;
                this.attachError = null;
            },

            uploadFiles(fileList) {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                this.uploading = true;
                this.attachError = null;
                const fd = new FormData();
                for (const f of files) fd.append('files', f);
                fetch('/api/email-uploads', {
                    method: 'POST',
                    body: fd,
                    credentials: 'same-origin',
                })
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.status !== 'ok') throw new Error(data.message || 'Upload failed');
                        this.attachments.push(...data.uploads);
                    })
                    .catch(e => { this.attachError = e.message; })
                    .finally(() => { this.uploading = false; });
            },

            removeAttachment(uploadId) {
                this.attachments = this.attachments.filter(a => a.upload_id !== uploadId);
                fetch(`/api/email-uploads/${uploadId}`, {
                    method: 'DELETE',
                    credentials: 'same-origin',
                }).catch(() => {});
            },

            _attachmentPayload() {
                return { attachments: this.attachments.map(a => ({ upload_id: a.upload_id })) };
            },

            _formatSize(size) {
                const n = Number(size);
                if (!n) return '0 B';
                if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
                if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
                return n + ' B';
            },

            _cleanupAttachments() {
                for (const a of this.attachments) {
                    fetch(`/api/email-uploads/${a.upload_id}`, {
                        method: 'DELETE',
                        credentials: 'same-origin',
                    }).catch(() => {});
                }
                this.attachments = [];
            },

            _destroyEditor() {
                if (this._editor && typeof this._editor.destruct === 'function') {
                    this._editor.destruct();
                }
                this._editor = null;
            },

            _initEditor() {
                if (!window.Jodit) {
                    this.error = 'Rich editor failed to load.';
                    return;
                }
                const self = this;
                const defaultBody = this._defaultTemplate();
                if (this._editor) {
                    this._editor.value = defaultBody;
                    return;
                }
                this._editor = Jodit.make('#bulk-email-editor', {
                    height: 340,
                    toolbarAdaptive: false,
                    toolbarSticky: false,
                    saveSelectionOnBlur: true,
                    askBeforePasteHTML: false,
                    askBeforePasteFromWord: false,
                    defaultActionOnPaste: 'insert_as_html',
                    disablePlugins: 'ai-assistant',
                    buttons: [
                        'bold', 'italic', 'underline', '|',
                        'ul', 'ol', '|',
                        'outdent', 'indent', '|',
                        'brush', '|',
                        'link', '|',
                        'align', '|',
                        'undo', 'redo'
                    ]
                });
                this._editor.value = defaultBody;
            },

            _defaultTemplate() {
                // Use double-bracket placeholders that won't conflict with Jodit's template syntax
                // Matches Gmail formatting: Arial 14px, 12px paragraph margins, blank line = new paragraph
                const ph = (text) =>
                    `<strong style="background:#fef3c7;border-radius:3px;padding:2px 8px;font-family:monospace;font-size:13px;color:#92400e;">${text}</strong>`;
                const p = (html) => `<p style="margin:0 0 12px 0;">${html}</p>`;
                const sig = this.userSignature ||
                    `<strong>${this.userName || ''}</strong><br>` +
                    `Eagle Exports<br>` +
                    `<span style="font-size:14px;color:#6b7280;">Spare Parts | Industrial | Workshop | Procurement<br>Supporting heavy industry since 1993</span><br>` +
                    `<span style="font-size:14px;">P: +61 7 3217 0050 &nbsp;|&nbsp; <a href="https://www.eaglexp.com.au">www.eaglexp.com.au</a></span><br>` +
                    `<span style="font-size:14px;">Unit 1, 18 Gravel Pit Road, Darra, Queensland, 4076</span><br>` +
                    `<span style="font-size:14px;">E: ${this.userEmail || ''}</span>`;
                return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:#111827;">` +
                    p(ph('[[SALUTATION]]')) +
                    p('Could you please confirm price and availability on the following items for resale:') +
                    p(ph('[[ITEMS_TABLE]]')) +
                    p('Please also advise of any freight costs for delivery to Darra, Brisbane 4076, Australia.') +
                    p('Thank you.') +
                    p('Regards,') +
                    p(sig) +
                    `</div>`;
            },

            _getEditorHtml() {
                return this._editor ? this._editor.value || '' : '';
            },

            _buildItemTable(lineItems) {
                if (!lineItems || !lineItems.length) return '<p><em>No items</em></p>';
                let html = '<table style="border-collapse:collapse;margin:12px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;" cellpadding="0" cellspacing="0">';
                html += '<thead><tr style="background-color:#f3f4f6;">';
                html += '<th style="border:1px solid #d1d5db;padding:8px 12px;text-align:left;">Item Description</th>';
                html += '<th style="border:1px solid #d1d5db;padding:8px 12px;text-align:left;">SKU / Part Number</th>';
                html += '<th style="border:1px solid #d1d5db;padding:8px 12px;text-align:center;">Quantity</th>';
                html += '</tr></thead><tbody>';
                for (const it of lineItems) {
                    const desc = `${it.description || '—'}${it.brand ? ' (' + it.brand + ')' : ''}`;
                    const qty = `${it.quantity || '—'}${it.uom ? ' ' + it.uom : ''}`;
                    html += '<tr>';
                    html += `<td style="border:1px solid #d1d5db;padding:8px 12px;">${desc}</td>`;
                    html += `<td style="border:1px solid #d1d5db;padding:8px 12px;">${it.part_number || '—'}</td>`;
                    html += `<td style="border:1px solid #d1d5db;padding:8px 12px;text-align:center;">${qty}</td>`;
                    html += '</tr>';
                }
                html += '</tbody></table>';
                return html;
            },

            _renderEmailFor(recipient) {
                const salutation = `Hi ${recipient.salutation_name || 'Sales Team'},`;
                const tableHtml = this._buildItemTable(recipient.line_items);
                let html = this._getEditorHtml();
                html = html.replace(/<strong[^>]*>\[\[SALUTATION\]\]<\/strong>/g, salutation);
                html = html.replace(/<strong[^>]*>\[\[ITEMS_TABLE\]\]<\/strong>/g, tableHtml);
                // Fallback: Jodit may strip wrapping tags, leaving raw placeholder text
                html = html.replace(/\[\[SALUTATION\]\]/g, salutation);
                html = html.replace(/\[\[ITEMS_TABLE\]\]/g, tableHtml);
                if (this.trackingId && !html.includes(this.trackingId)) {
                    html += `<p style="margin-top:16px;font-size:10px;line-height:1.2;color:#6b7280;">Tracking ID: ${this.trackingId}</p>`;
                }
                return html;
            },

            async sendAll() {
                this.isSending = true;
                this.mode = 'sending';
                this.sendResults = [];
                for (let i = 0; i < this.recipients.length; i++) {
                    const r = this.recipients[i];
                    try {
                        const bodyHtml = this._renderEmailFor(r);
                        const resp = await fetch(`/api/rfqs/${this.rfqId}/send-email-direct`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                recipient_email: r.email,
                                recipient_name: r.contact_name || r.name,
                                subject: (this.trackingId ? '[' + this.trackingId + '] ' : '') + this.subject,
                                body_html: bodyHtml,
                                ...this._attachmentPayload(),
                            }),
                        });
                        const data = await resp.json();
                        if (data.status !== 'ok') throw new Error(data.message || 'Send failed');
                        this.sendResults.push({ name: r.name, status: 'ok' });
                    } catch (err) {
                        this.sendResults.push({ name: r.name, status: 'error', error: err.message });
                    }
                    if (i < this.recipients.length - 1) {
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
                this._cleanupAttachments();
                this.mode = 'result';
                this.isSending = false;
                this.okCount = this.sendResults.filter(r => r.status === 'ok').length;
                this.failCount = this.sendResults.filter(r => r.status === 'error').length;
                if (typeof htmx !== 'undefined') {
                    htmx.ajax('GET', `/partial/rfqs/${this.rfqId}/email-suppliers`, {
                        target: '#email-suppliers-panel',
                        swap: 'innerHTML',
                    });
                }
            },

            async saveAllDrafts() {
                this.isSending = true;
                this.mode = 'sending';
                this.sendResults = [];
                for (let i = 0; i < this.recipients.length; i++) {
                    const r = this.recipients[i];
                    try {
                        const bodyHtml = this._renderEmailFor(r);
                        const resp = await fetch(`/api/rfqs/${this.rfqId}/send-email-draft`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                recipient_email: r.email,
                                recipient_name: r.contact_name || r.name,
                                subject: (this.trackingId ? '[' + this.trackingId + '] ' : '') + this.subject,
                                body_html: bodyHtml,
                                ...this._attachmentPayload(),
                            }),
                        });
                        const data = await resp.json();
                        if (data.status !== 'ok') throw new Error(data.message || 'Draft failed');
                        this.sendResults.push({ name: r.name, status: 'ok', compose_url: data.compose_url });
                    } catch (err) {
                        this.sendResults.push({ name: r.name, status: 'error', error: err.message });
                    }
                    if (i < this.recipients.length - 1) {
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
                this._cleanupAttachments();
                this.mode = 'result';
                this.isSending = false;
                this.okCount = this.sendResults.filter(r => r.status === 'ok').length;
                this.failCount = this.sendResults.filter(r => r.status === 'error').length;
                if (typeof htmx !== 'undefined') {
                    htmx.ajax('GET', `/partial/rfqs/${this.rfqId}/email-suppliers`, {
                        target: '#email-suppliers-panel',
                        swap: 'innerHTML',
                    });
                }
            },
        }));
    });

    // Bulk email selection store — registered via alpine:init so it's always
    // available before any HTMX partial references $store.bulkEmail.
    document.addEventListener('alpine:init', () => {
        Alpine.store('bulkEmail', {
        selected: [],
        emailMap: {},
        totalCount: 0,
        selectedCount: 0,
        emailSelectedCount: 0,
        allSelected: false,

        init() {
            const el = document.getElementById('bulk-email-map');
            if (el) {
                try { this.emailMap = JSON.parse(el.textContent.trim()); } catch(e) {}
                this.totalCount = Object.keys(this.emailMap).length;
            }
            this.selected = [];
            this._recalc();
        },

        _recalc() {
            this.selectedCount = this.selected.length;
            this.emailSelectedCount = this.selected.filter(k => this.emailMap[k]).length;
            const emailabled = Object.keys(this.emailMap).filter(k => this.emailMap[k]).length;
            this.allSelected = this.emailSelectedCount > 0 && this.emailSelectedCount === emailabled;
        },

        toggle(key) {
            if (!this.emailMap[key]) return;
            const idx = this.selected.indexOf(key);
            if (idx >= 0) this.selected.splice(idx, 1);
            else this.selected.push(key);
            this._recalc();
        },

        selectAll() {
            this.selected = Object.keys(this.emailMap).filter(k => this.emailMap[k]);
            this._recalc();
        },

        deselectAll() {
            this.selected = [];
            this._recalc();
        },

        composeSelected() {
            const withEmail = this.selected.filter(k => this.emailMap[k]);
            if (!withEmail.length) return;
            const dataEl = document.getElementById('bulk-supplier-data');
            if (!dataEl) return;
            try {
                const allSuppliers = JSON.parse(dataEl.textContent.trim());
                const selected = allSuppliers.filter(s => withEmail.includes(s.name));
                if (!selected.length) return;
                if (window.__bulkComposeOpen) {
                    window.__bulkComposeOpen(selected, this._rfqId || '', this._oppId || null);
                }
            } catch(e) {}
        },
    });
    });

    // RFQ edit form components — registered globally so HTMX-loaded partials
    // can reference them via x-data="rfqCustomerSearch(...)" without inline JS.
    document.addEventListener('alpine:init', () => {
        Alpine.data('rfqCustomerSearch', (initialSearch, initialSelectedId) => ({
            search: initialSearch,
            selectedId: initialSelectedId,
            results: [],
            searching: false,
            activeIdx: -1,
            debounce: null,

            doSearch() {
                clearTimeout(this.debounce);
                const q = this.search.trim();
                if (q.length < 2) { this.results = []; this.activeIdx = -1; return; }
                this.debounce = setTimeout(() => {
                    this.searching = true;
                    fetch("/api/customers/search?q=" + encodeURIComponent(q))
                        .then(r => r.json())
                        .then(d => {
                            this.results = d.results || [];
                            this.activeIdx = -1;
                            this.searching = false;
                            if (!this.results.some(r => r.name === this.search)) this.selectedId = "";
                        })
                        .catch(() => { this.results = []; this.activeIdx = -1; this.searching = false; });
                }, 200);
            },

            select(r) {
                this.search = r.name;
                this.selectedId = r.id;
                this.results = [];
                this.activeIdx = -1;
                const store = Alpine.store('rfqEdit');
                if (store) {
                    store.customerId = r.id;
                    store.customerError = '';
                }
                // Persist the customer link immediately so downstream actions
                // (e.g. create NetSuite opportunity) don't need a full Save.
                if (store && store.rfqId) {
                    store.customerSaving = true;
                    fetch(`/partial/rfqs/${store.rfqId}/link-customer`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ customer_id: r.id, customer: r.name })
                    })
                    .then(resp => resp.json())
                    .then(d => {
                        store.customerSaving = false;
                        if (d.status !== 'ok') {
                            store.customerError = d.message || 'Failed to save customer';
                            store.customerId = '';
                            this.search = '';
                            this.selectedId = '';
                        }
                    })
                    .catch(() => {
                        store.customerSaving = false;
                        store.customerError = 'Failed to save customer — check connection';
                        store.customerId = '';
                        this.search = '';
                        this.selectedId = '';
                    });
                }
            },

            clearAll() {
                this.search = "";
                this.selectedId = "";
                this.results = [];
                const store = Alpine.store('rfqEdit');
                if (store) {
                    store.customerId = '';
                    store.customerError = '';
                }
            },

            onKeydown(e) {
                if (!this.results.length) return;
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    this.activeIdx = (this.activeIdx + 1) % this.results.length;
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    this.activeIdx = (this.activeIdx - 1 + this.results.length) % this.results.length;
                } else if (e.key === "Enter" && this.activeIdx !== -1) {
                    e.preventDefault();
                    this.select(this.results[this.activeIdx]);
                } else if (e.key === "Escape") {
                    this.results = [];
                    this.activeIdx = -1;
                }
            }
        }));

        Alpine.data('rfqBrandSearch', (initialSearch, initialSelectedId) => ({
            search: initialSearch,
            selectedId: initialSelectedId,
            results: [],
            searching: false,
            activeIdx: -1,
            debounce: null,

            doSearch() {
                clearTimeout(this.debounce);
                const q = this.search.trim();
                if (q.length < 2) { this.results = []; this.activeIdx = -1; return; }
                this.debounce = setTimeout(() => {
                    this.searching = true;
                    fetch("/api/brands/search?q=" + encodeURIComponent(q))
                        .then(r => r.json())
                        .then(d => {
                            this.results = d.results || [];
                            this.activeIdx = -1;
                            this.searching = false;
                            if (!this.results.some(r => r.name === this.search)) this.selectedId = "";
                        })
                        .catch(() => { this.results = []; this.activeIdx = -1; this.searching = false; });
                }, 200);
            },

            select(r) {
                this.search = r.name;
                this.selectedId = r.id;
                this.results = [];
                this.activeIdx = -1;
            },

            clearAll() {
                this.search = "";
                this.selectedId = "";
                this.results = [];
            },

            onKeydown(e) {
                if (!this.results.length) return;
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    this.activeIdx = (this.activeIdx + 1) % this.results.length;
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    this.activeIdx = (this.activeIdx - 1 + this.results.length) % this.results.length;
                } else if (e.key === "Enter" && this.activeIdx !== -1) {
                    e.preventDefault();
                    this.select(this.results[this.activeIdx]);
                } else if (e.key === "Escape") {
                    this.results = [];
                    this.activeIdx = -1;
                }
            }
        }));

        Alpine.data('rfqOppSearch', (initialOpp, initialOppId, hasExisting) => ({
            oppSearch: initialOpp,
            oppSelectedId: initialOppId,
            oppResults: [],
            oppSearching: false,
            oppDebounce: null,
            oppActiveIdx: -1,
            showLookup: hasExisting,

            init() {
                this.$watch("oppSearch", () => this.oppDoSearch());
            },

            oppDoSearch() {
                clearTimeout(this.oppDebounce);
                const q = this.oppSearch.trim();
                if (q.length < 2) { this.oppResults = []; this.oppActiveIdx = -1; return; }
                this.oppDebounce = setTimeout(() => {
                    this.oppSearching = true;
                    const cid = document.querySelector(`input[name="customer_id"]`)?.value || "";
                    fetch("/api/opportunities/search?q=" + encodeURIComponent(q) + "&customer_id=" + encodeURIComponent(cid))
                        .then(r => r.json())
                        .then(d => {
                            this.oppResults = d.results || [];
                            this.oppActiveIdx = -1;
                            this.oppSearching = false;
                            if (!this.oppResults.some(r => (r.number || r.name || "").toUpperCase() === this.oppSearch.toUpperCase())) this.oppSelectedId = "";
                        })
                        .catch(() => { this.oppResults = []; this.oppActiveIdx = -1; this.oppSearching = false; });
                }, 200);
            },

            oppSelect(r) {
                this.oppSearch = r.number || r.name;
                this.oppSelectedId = r.id;
                this.oppResults = [];
                this.oppActiveIdx = -1;
                if (r.customer_id && r.customer_name) {
                    const ci = document.querySelector(`input[name="customer"]`);
                    const custDiv = ci?.closest(`[x-data]`);
                    if (custDiv?._x_dataStack?.[0]) {
                        const cd = custDiv._x_dataStack[0];
                        cd.search = r.customer_name;
                        cd.selectedId = r.customer_id;
                        cd.results = [];
                    }
                }
                if (r.title) {
                    const ti = document.querySelector(`input[name="title"]`);
                    if (ti) ti.value = r.title;
                }
                if (r.salesrep_email) {
                    const os = document.querySelector(`select[name="assigned_to"]`);
                    if (os) os.value = r.salesrep_email;
                }
            },

            oppClearAll() {
                this.oppSearch = "";
                this.oppSelectedId = "";
                this.oppResults = [];
            },

            oppOnKeydown(e) {
                if (!this.oppResults.length) return;
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    this.oppActiveIdx = (this.oppActiveIdx + 1) % this.oppResults.length;
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    this.oppActiveIdx = (this.oppActiveIdx - 1 + this.oppResults.length) % this.oppResults.length;
                } else if (e.key === "Enter" && this.oppActiveIdx !== -1) {
                    e.preventDefault();
                    this.oppSelect(this.oppResults[this.oppActiveIdx]);
                } else if (e.key === "Escape") {
                    this.oppResults = [];
                    this.oppActiveIdx = -1;
                }
            }
        }));
    });
    </script>
    <script>
    // ── RFQ communications polling ─────────────────────────────────────────
    // One shared timer refreshing the comms block in place. Polls whenever the
    // block is on screen (so it picks up pipeline runs triggered from another
    // tab/page), with a faster interval while a pipeline is processing.
    // Reconciled after every HTMX swap and on tab visibility changes.
    window._commsPoll = {
        timer: null,
        interval: null,
        start(url, interval) {
            if (!url) return;
            if (this.timer && this.interval === interval) return;
            this.stop();
            this.interval = interval;
            this.timer = setInterval(() => {
                if (!document.getElementById('rfq-comms')) { this.stop(); return; }
                htmx.ajax('GET', url, { target: '#rfq-comms', swap: 'outerHTML' });
            }, interval);
        },
        stop() {
            if (this.timer) { clearInterval(this.timer); this.timer = null; this.interval = null; }
        }
    };
    function _reconcileCommsPoll() {
        if (document.hidden) { window._commsPoll.stop(); return; }
        var block = document.getElementById('rfq-comms');
        if (!block) { window._commsPoll.stop(); return; }
        var interval = block.dataset.processing === 'true' ? 4000 : 10000;
        window._commsPoll.start(block.dataset.pollUrl, interval);
    }
    document.addEventListener('htmx:afterSwap', _reconcileCommsPoll);
    // htmx:load fires on initial page load (and after content loads) — without
    // this, a full page render of the comms tab never starts the poller.
    document.addEventListener('htmx:load', _reconcileCommsPoll);
    document.addEventListener('visibilitychange', _reconcileCommsPoll);
    document.addEventListener('htmx:beforeRequest', function (e) {
        // A swap that replaces #main-content removes the comms block; stop
        // polling — htmx:afterSwap will restart it if the new page needs it.
        if (e.detail.elt && e.detail.elt.id === 'main-content') {
            window._commsPoll.stop();
        }
    });
    window.addEventListener('beforeunload', function () { window._commsPoll.stop(); });
    // Kick the poller immediately for the initial page render.
    _reconcileCommsPoll();

    // Back/forward from the browser bfcache restores a stale page without any
    // request — refetch main content so data is always current.
    window.addEventListener('pageshow', function (event) {
        if (event.persisted && window.htmx) {
            htmx.ajax('GET', location.pathname + location.search, {
                target: '#main-content',
                swap: 'innerHTML'
            });
        }
    });
    </script>
