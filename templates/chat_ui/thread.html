{% extends "base.html" %}

{% block title %}{{ thread.name }} — EagleAgent{% endblock %}

{% block content %}
<div class="pt-4 flex flex-col" style="height: calc(100vh - 7.5rem);">
    <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2 min-w-0">
            <a href="/chat-ui" class="px-2.5 py-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" title="Back to chats">←</a>
            <h1 id="thread-name" class="text-lg font-semibold text-gray-800 dark:text-gray-100 truncate">{{ thread.name }}</h1>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300">BETA</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button type="button" id="stop-btn" hidden
                    class="py-1.5 px-3 inline-flex items-center gap-x-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white hover:bg-red-700">
                ⏹ Stop
            </button>
        </div>
    </div>

    <div id="messages"
         class="flex-1 overflow-y-auto rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4 space-y-3"></div>

    <div id="error-bar" hidden
         class="mt-2 rounded-lg bg-red-50 border border-red-200 p-3 text-xs text-red-700 dark:bg-red-900/30 dark:border-red-800 dark:text-red-300"></div>

    <div class="mt-2">
        <div class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-2xl shadow-xs transition-colors focus-within:border-blue-400 dark:focus-within:border-blue-600">
            <label for="composer" class="sr-only">Message…</label>
            <div class="pb-1.5 px-2">
                <textarea id="composer" rows="1" placeholder="Message…"
                          class="max-h-36 mt-2 pt-3 pb-1.5 ps-2 pe-4 block w-full bg-transparent border-transparent resize-none text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:outline-hidden focus:border-transparent focus:ring-transparent overflow-y-auto"></textarea>
                <div class="pt-1 flex justify-between items-center gap-x-1">
                    <!-- Tools (commands) -->
                    <div class="flex items-center gap-x-1">
                        <div class="relative inline-flex">
                            <button type="button" id="tools-btn" title="Commands"
                                    class="flex justify-center items-center gap-x-1 py-1.5 px-2 text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-neutral-800 rounded-lg">
                                <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 17H5" />
                                    <path d="M19 7h-9" />
                                    <circle cx="17" cy="17" r="3" />
                                    <circle cx="7" cy="7" r="3" />
                                </svg>
                                Tools
                            </button>
                            <div id="tools-menu" role="menu" hidden
                                 class="absolute bottom-full start-0 mb-1.5 z-11 w-60 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-lg p-1"></div>
                        </div>
                        <div id="intent-chip" class="flex items-center gap-x-1.5 min-w-0" hidden></div>
                    </div>
                    <!-- Agent + send -->
                    <div class="flex items-center gap-x-1">
                        <button type="button" id="send-btn" title="Send"
                                class="inline-flex shrink-0 justify-center items-center size-8 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
                            <span class="sr-only">Send</span>
                            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m5 12 7-7 7 7" />
                                <path d="M12 19V5" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="application/json" id="chat-data">
{{ {"thread_id": thread.id, "user_email": user.email, "steps": steps, "agents": agent_options, "commands": commands, "thread_agent": thread_agent} | tojson }}
</script>

<script>
(function () {
    var DATA = JSON.parse(document.getElementById('chat-data').textContent);
    var THREAD_ID = DATA.thread_id;
    var USER_EMAIL = DATA.user_email;
    var HISTORY = DATA.steps;
    var container = document.getElementById('messages');
    var composer = document.getElementById('composer');
    var sendBtn = document.getElementById('send-btn');
    var stopBtn = document.getElementById('stop-btn');
    var errorBar = document.getElementById('error-bar');
    var toolsBtn = document.getElementById('tools-btn');
    var toolsMenu = document.getElementById('tools-menu');
    var intentChip = document.getElementById('intent-chip');
    var rows = {};
    var eventSource = null;
    var pendingIntent = null;  // {name,label,icon} for the next message only

    function autoresizeComposer() {
        composer.style.height = 'auto';
        composer.style.height = Math.min(composer.scrollHeight, 144) + 'px';
    }

    function useCommand(cmd) {
        // One-shot command: routes the NEXT message only, then falls back to
        // the default agent. No persistent select to leak state.
        pendingIntent = {name: cmd.name, label: cmd.label, icon: cmd.icon || '⚡'};
        composer.value = cmd.prefill || (cmd.label + ': ');
        composer.focus();
        autoresizeComposer();
        toolsMenu.hidden = true;
        renderIntentChip();
    }

    function renderIntentChip() {
        intentChip.innerHTML = '';
        if (!pendingIntent) { intentChip.hidden = true; return; }
        intentChip.hidden = false;
        var chip = document.createElement('div');
        chip.className = 'flex items-center gap-1 rounded-lg bg-blue-50 dark:bg-blue-900/30 px-2 py-1 text-xs text-blue-700 dark:text-blue-300 max-w-[150px]';
        var icon = document.createElement('span');
        icon.className = 'shrink-0';
        icon.textContent = pendingIntent.icon;
        var label = document.createElement('span');
        label.className = 'truncate';
        label.textContent = pendingIntent.label;
        var remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '✕';
        remove.title = 'Clear command';
        remove.className = 'text-blue-400 hover:text-blue-700 dark:hover:text-blue-200 px-0.5';
        remove.addEventListener('click', function () { clearIntent(); });
        chip.appendChild(icon);
        chip.appendChild(label);
        chip.appendChild(remove);
        intentChip.appendChild(chip);
    }

    function clearIntent() {
        pendingIntent = null;
        composer.value = '';
        autoresizeComposer();
        renderIntentChip();
    }

    function renderCommands() {
        toolsMenu.innerHTML = '';
        var cmds = DATA.commands || [];
        if (!cmds.length) { toolsBtn.hidden = true; return; }
        cmds.forEach(function (cmd) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-full flex items-start gap-x-2.5 py-1.5 px-2 rounded-lg text-start hover:bg-gray-100 dark:hover:bg-neutral-800';
            var icon = document.createElement('span');
            icon.className = 'shrink-0 text-xs leading-5';
            icon.textContent = cmd.icon || '⚡';
            var body = document.createElement('span');
            var lab = document.createElement('span');
            lab.className = 'block text-xs font-medium text-gray-800 dark:text-gray-200';
            lab.textContent = cmd.label;
            var desc = document.createElement('span');
            desc.className = 'block text-[11px] text-gray-400 dark:text-gray-500';
            desc.textContent = cmd.description;
            body.appendChild(lab);
            body.appendChild(desc);
            btn.appendChild(icon);
            btn.appendChild(body);
            btn.addEventListener('click', function () { useCommand(cmd); });
            toolsMenu.appendChild(btn);
        });
    }

    function stripHtml(text) {
        // Sanitise-on-read: legacy steps.output contains baked-in HTML
        // (unsafe_allow_html era). Never render it as live HTML.
        return String(text || '').replace(/<[^>]*>/g, '');
    }

    function renderMarkdown(text) {
        var clean = stripHtml(text);
        try {
            if (window.marked && typeof window.marked.parse === 'function') {
                var out = window.marked.parse(clean);
                var str = typeof out === 'string' ? out : String(out);
                // Re-mark the runner's agent summary footer: its inline styles
                // are stripped by sanitise-on-read, so the CSS class does the work.
                str = str.replace(/<p>Agent: /g, '<p class="agent-footer">Agent: ');
                return str;
            }
        } catch (err) {
            console.error('[chat-ui] markdown render failed', err);
        }
        var esc = document.createElement('div');
        esc.textContent = clean;
        return esc.innerHTML;
    }

    function rowEl(id, author, transient) {
        var div = document.createElement('div');
        var isUser = author === USER_EMAIL;
        if (transient) {
            div.className = 'text-xs text-gray-400 dark:text-gray-500 italic';
            return div;
        }
        var bubble = document.createElement('div');
        bubble.className = isUser
            ? 'ml-auto max-w-[80%] rounded-lg bg-blue-600 text-white px-3 py-2 text-sm'
            : 'mr-auto max-w-[80%] rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100 px-3 py-2 chat-md';
        div.appendChild(bubble);
        div.className = 'flex ' + (isUser ? 'justify-end' : 'justify-start');
        return {div: div, bubble: bubble};
    }

    function getRow(id, author, transient) {
        if (rows[id]) { return rows[id]; }
        var el = rowEl(id, author, transient);
        rows[id] = el;
        container.appendChild(el.div);
        return el;
    }

    function setText(entry, text) {
        entry._text = String(text || '');
        if (entry.bubble) {
            entry.bubble.innerHTML = renderMarkdown(entry._text);
        } else {
            entry.div.textContent = entry._text;
        }
    }

    function scrollToBottom() {
        container.scrollTop = container.scrollHeight;
    }

    function renderHistory() {
        var live = {};
        Object.keys(rows).forEach(function (id) {
            if (rows[id]._live) { live[id] = rows[id]; }
        });
        container.innerHTML = '';
        rows = {};
        (HISTORY || []).forEach(function (step) {
            if (live[step.id]) {
                rows[step.id] = live[step.id];
                container.appendChild(live[step.id].div);
                delete live[step.id];
                return;
            }
            if (step.type === 'user_message') {
                setText(getRow(step.id, USER_EMAIL, false), step.output);
            } else if (step.type === 'assistant_message' && step.output) {
                setText(getRow(step.id, step.name || 'EagleAgent', false), step.output);
            }
        });
        Object.keys(live).forEach(function (id) {
            rows[id] = live[id];
            container.appendChild(live[id].div);
        });
        scrollToBottom();
    }

    function showError(msg) {
        errorBar.textContent = msg;
        errorBar.hidden = false;
    }

    function clearError() {
        errorBar.hidden = true;
    }

    function setRunning(running) {
        sendBtn.disabled = running;
        stopBtn.hidden = !running;
    }

    function openStream() {
        if (eventSource) { eventSource.close(); }
        eventSource = new EventSource('/chat-ui/threads/' + THREAD_ID + '/stream');

        eventSource.addEventListener('message_start', function (e) {
            var d = JSON.parse(e.data);
            var entry = getRow(d.id, d.author || 'EagleAgent', !!d.transient);
            entry._live = true;
            if (d.content) { setText(entry, d.content); }
        });
        eventSource.addEventListener('token', function (e) {
            var d = JSON.parse(e.data);
            var row = rows[d.id];
            if (row) { setText(row, (row._text || '') + d.text); }
            scrollToBottom();
        });
        eventSource.addEventListener('message_update', function (e) {
            var d = JSON.parse(e.data);
            if (rows[d.id]) { setText(rows[d.id], d.content); }
        });
        eventSource.addEventListener('message_remove', function (e) {
            var d = JSON.parse(e.data);
            if (rows[d.id]) {
                rows[d.id]._live = false;
                rows[d.id].div.remove();
                delete rows[d.id];
            }
        });
        eventSource.addEventListener('message_end', function (e) {
            var d = JSON.parse(e.data);
            if (rows[d.id]) { setText(rows[d.id], d.content); }
        });
        eventSource.addEventListener('error', function (e) {
            var d = {};
            try { d = JSON.parse(e.data); } catch (err) {}
            showError(d.message || 'Something went wrong.');
        });
        eventSource.addEventListener('done', function () {
            if (eventSource) { eventSource.close(); eventSource = null; }
            setRunning(false);
            // Re-render canonical history (persisted steps) once the run ends.
            fetch('/chat-ui/threads/' + THREAD_ID + '/messages', {credentials: 'same-origin'})
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    HISTORY = data.steps || [];
                    renderHistory();
                    Object.keys(rows).forEach(function (id) { rows[id]._live = false; });
                })
                .catch(function () {});
        });
    }

    function send() {
        var text = composer.value.trim();
        if (!text) { return; }
        clearError();
        composer.value = '';
        autoresizeComposer();
        setRunning(true);
        var payload = {text: text};
        if (pendingIntent) { payload.intent = pendingIntent.name; }
        fetch('/chat-ui/threads/' + THREAD_ID + '/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify(payload)
        }).then(function (r) {
            return r.json().then(function (data) { return {ok: r.ok, data: data}; });
        }).then(function (res) {
            if (!res.ok) {
                setRunning(false);
                showError(res.data.error || 'Failed to send message.');
                composer.value = text;
                return;
            }
            // Render the user message locally; server also persisted it.
            var uid = 'user-' + Date.now();
            var u = getRow(uid, USER_EMAIL, false);
            setText(u, text);
            pendingIntent = null;
            renderIntentChip();
            scrollToBottom();
            openStream();
        }).catch(function () {
            setRunning(false);
            showError('Network error — please retry.');
            composer.value = text;
        });
    }

    sendBtn.addEventListener('click', send);
    composer.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });
    composer.addEventListener('input', autoresizeComposer);
    toolsBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        toolsMenu.hidden = !toolsMenu.hidden;
    });
    document.addEventListener('click', function (e) {
        if (!toolsMenu.hidden && !toolsMenu.contains(e.target) && !toolsBtn.contains(e.target)) {
            toolsMenu.hidden = true;
        }
    });

    stopBtn.addEventListener('click', function () {
        fetch('/chat-ui/threads/' + THREAD_ID + '/stop', {
            method: 'POST', credentials: 'same-origin'
        }).catch(function () {});
    });

    renderCommands();
    autoresizeComposer();
    renderHistory();
    composer.focus();
})();
</script>
{% endblock %}
