[project]
name = "eagleagent"
version = "0.1.0"
description = "Agentic Helper for Eagle Exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic~=1.18.4",
    "asyncpg~=0.31.0",
    "beautifulsoup4~=4.13",
    "boto3~=1.43",
    "chainlit~=2.11.1",
    "email-reply-parser~=0.5",
    "fastapi~=0.136.1",
    "fastapi-sso~=0.17",
    "google-api-python-client~=2.100",
    "google-auth>=2.0",
    "google-genai~=1.68",
    "greenlet~=3.5.0",
    "html2text~=2025.4",
    "httpx~=0.27",
    "hubspot-api-client~=12.0",
    "itsdangerous~=2.2",
    "jinja2~=3.1",
    "langchain~=1.3.9",
    "langchain-google-genai~=4.2.2",
    "langchain-mcp-adapters~=0.2.2",
    "langgraph~=1.2.5",
    "langgraph-checkpoint-postgres~=3.0.5",
    "mcp~=1.28.1",
    "openpyxl~=3.1",
    "pandas~=3.0",
    "pdfplumber~=0.11.9",
    "pgvector~=0.4",
    "pillow~=12.3.0",
    "psycopg[binary]~=3.3.4",
    "pypdfium2~=5.5",
    "pyjwt[crypto]~=2.8",
    "python-multipart~=0.0",
    "rapidfuzz~=3.12",
    "scikit-learn~=1.6",
    "sqlalchemy~=2.0.49",
    "uvicorn[standard]~=0.30",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-timeout~=2.3",
    "pip-audit~=2.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
